name: Windeep Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: release-windows
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: G1 Checkout tagged repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION v$version" }
          $tagCommit = (git rev-list -n 1 "${{ github.ref_name }}").Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) { throw "Release checkout is not the tagged commit: tag=$tagCommit head=$headCommit" }

      - name: G2 Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-capture.txt

      - name: G3 Install runtime and development requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: G4 Phase A static audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase A
          if ($LASTEXITCODE -ne 0) { Get-Content reports/static_audit.md; exit $LASTEXITCODE }

      - name: G5 Phase B tool packaging contract audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase B
          if ($LASTEXITCODE -ne 0) { Get-Content reports/tool_liveness.md; exit $LASTEXITCODE }

      - name: G6 Phase E dependency audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase E
          if ($LASTEXITCODE -ne 0) { Get-Content reports/dependency_audit.md; exit $LASTEXITCODE }

      - name: G7 Pytest with minimum 85 percent coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          python -m pytest -q --cov=app --cov=launcher --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=85

      - name: G8 Phase D local end-to-end audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase D
          if ($LASTEXITCODE -ne 0) { Get-Content reports/e2e_audit.md; exit $LASTEXITCODE }

      - name: G9 Phase F release gate
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase F
          if ($LASTEXITCODE -ne 0) { Get-Content reports/release_gate.json; exit $LASTEXITCODE }

      - name: G10 Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: G11 Download, checksum and liveness-verify portable tools
        shell: pwsh
        run: |
          ./installer/setup_tools.ps1
          python scripts/audit/release_audit.py --phase B --require-installed
          if ($LASTEXITCODE -ne 0) { Get-Content reports/tool_liveness.md; exit $LASTEXITCODE }

      - name: G12 Bundle embedded Python 3.11 and isolated capture Python 3.12
        shell: pwsh
        run: |
          ./installer/install_python.ps1
          ./installer/install_capture_runtime.ps1
          .\runtime\capture-python\python.exe -m pip check
          $captureVersion = (.\runtime\capture-python\Scripts\mitmdump.exe --version | Out-String)
          if ($LASTEXITCODE -ne 0 -or $captureVersion -notmatch '12\.2\.3') { throw "Pinned capture runtime verification failed: $captureVersion" }

      - name: G13 Build Windeep with PyInstaller
        shell: pwsh
        run: pyinstaller --clean --noconfirm Windeep.spec

      - name: G14 Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found at $iscc" }
          $version = (Get-Content VERSION -Raw).Trim()
          & $iscc "/DMyAppVersion=$version" 'installer\BugBountyInstaller.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: G15 Create portable archive
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath dist\Windeep-Portable.zip) { Remove-Item dist\Windeep-Portable.zip -Force }
          Compress-Archive -Path dist\Windeep\* -DestinationPath dist\Windeep-Portable.zip -CompressionLevel Optimal

      - name: G16 Verify installer and portable build on clean Windows runner
        shell: pwsh
        run: |
          ./scripts/audit/windows_install_audit.ps1
          if ($LASTEXITCODE -ne 0) { Get-Content reports/windows_install_audit.md; exit $LASTEXITCODE }

      - name: G17 Create exact tagged source snapshot
        shell: pwsh
        run: |
          $archive = "dist\windeep-source-${{ github.ref_name }}.zip"
          git archive --format=zip --output=$archive "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $archive)) { throw 'git archive failed' }

      - name: G18 Generate release notes and SBOM
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $previous = $null
          try { $previous = (git describe --tags --abbrev=0 HEAD^ 2>$null).Trim() } catch { }
          if ($previous) { $range = "$previous..HEAD"; $since = $previous } else { $range = 'HEAD'; $since = 'repository start' }
          $commits = @(git log $range --pretty=format:'- %h %s (%an)')
          $changelog = (Get-Content CHANGELOG.md -Raw).Trim()
          $gate = Get-Content reports\release_gate.json -Raw | ConvertFrom-Json
          if ($gate.decision -ne 'GO') { throw 'Refusing release notes for a NO-GO release gate' }
          $notes = [System.Collections.Generic.List[string]]::new()
          $notes.Add("# Windeep v$version") | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add("Release gate: **$($gate.decision)**") | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add('## Changelog') | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add($changelog) | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add("## Commits since $since") | Out-Null
          $notes.Add('') | Out-Null
          foreach ($commit in $commits) { $notes.Add($commit) | Out-Null }
          $notes.Add('') | Out-Null
          $notes.Add('## Verification') | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add('Verify SHA-256 hashes with `SHA256SUMS.txt`. GitHub build-provenance attestations can be checked with `gh attestation verify <asset> --repo aprashnasuraj-dev/winddeep`.') | Out-Null
          $notes | Set-Content -LiteralPath dist\RELEASE-NOTES.md -Encoding utf8
          python scripts/audit/generate_sbom.py --output dist/SBOM.json
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath dist\SBOM.json)) { throw 'SBOM generation failed' }

      - name: G19 Stage release evidence and generate final SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\reports -Force | Out-Null
          $reportNames = @('static_audit.md','tool_liveness.md','dependency_audit.md','e2e_audit.md','windows_install_audit.md','release_gate.json','coverage.xml')
          foreach ($name in $reportNames) {
            $source = Join-Path 'reports' $name
            if (Test-Path -LiteralPath $source) { Copy-Item $source (Join-Path 'dist\reports' $name) -Force }
          }
          $required = @(
            'Windeep-Setup.exe',
            'Windeep-Portable.zip',
            "windeep-source-${{ github.ref_name }}.zip",
            'RELEASE-NOTES.md',
            'SBOM.json',
            'reports\static_audit.md',
            'reports\tool_liveness.md',
            'reports\windows_install_audit.md',
            'reports\release_gate.json'
          )
          $lines = foreach ($rel in $required) {
            $file = Join-Path 'dist' $rel
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release asset: $file" }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($rel.Replace('\','/'))"
          }
          $lines | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii

      - name: G20 Attest release artifacts with GitHub build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/Windeep-Setup.exe
            dist/Windeep-Portable.zip
            dist/windeep-source-*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/SBOM.json
            dist/reports/static_audit.md
            dist/reports/tool_liveness.md
            dist/reports/windows_install_audit.md
            dist/reports/release_gate.json

      - name: G21 Bind SBOM attestation to installer
        uses: actions/attest@v4
        with:
          subject-path: dist/Windeep-Setup.exe
          sbom-path: dist/SBOM.json

      - name: G22 Publish verified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body_path: dist/RELEASE-NOTES.md
          files: |
            dist/Windeep-Setup.exe
            dist/Windeep-Portable.zip
            dist/windeep-source-*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/SBOM.json
            dist/reports/static_audit.md
            dist/reports/tool_liveness.md
            dist/reports/dependency_audit.md
            dist/reports/e2e_audit.md
            dist/reports/windows_install_audit.md
            dist/reports/release_gate.json
            dist/reports/coverage.xml

      - name: Preserve release evidence as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windeep-${{ github.ref_name }}-release-evidence
          if-no-files-found: warn
          path: |
            reports/
            runtime/capture-requirements.lock
            dist/*.exe
            dist/*.zip
            dist/*.txt
            dist/*.md
            dist/*.json
            dist/reports/
