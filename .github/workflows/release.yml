name: Windeep Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: windeep-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Audit, build, verify, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      WINDEEP_GPG_PRIVATE_KEY_B64: ${{ secrets.WINDEEP_GPG_PRIVATE_KEY_B64 }}
      WINDEEP_GPG_PASSPHRASE: ${{ secrets.WINDEEP_GPG_PASSPHRASE }}

    steps:
      # G1
      - name: G1 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # G2
      - name: G2 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # G3
      - name: G3 Install runtime and development requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # G4
      - name: G4 Phase A - static release audit
        shell: pwsh
        run: python scripts/audit/static_audit.py

      # G5
      - name: G5 Phase B - tool liveness and installer wiring audit
        shell: pwsh
        run: python scripts/audit/tool_liveness.py

      # G6
      - name: G6 Phase E - dependency audit
        shell: pwsh
        run: python scripts/audit/dependency_audit.py

      # G7
      - name: G7 Pytest with minimum 85 percent coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          python -m pytest -q `
            --cov=app `
            --cov-report=term-missing `
            --cov-report=xml:reports/coverage.xml `
            --cov-fail-under=85 `
            --junitxml=reports/pytest.xml

      # G8
      - name: G8 Phase D - end-to-end audit
        shell: pwsh
        run: python scripts/audit/e2e_audit.py

      # G9
      - name: G9 Phase F - release gate
        shell: pwsh
        run: python scripts/audit/release_gate.py

      - name: Validate tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "VERSION is not valid SemVer: $version"
          }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION v$version"
          }
          "WINDEEP_VERSION=$version" >> $env:GITHUB_ENV

      # G10
      - name: G10 Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # G11
      - name: G11 Download and verify pinned portable tools
        shell: pwsh
        run: ./installer/setup_tools.ps1

      # G12
      - name: G12 Bundle pinned embedded Python runtime
        shell: pwsh
        run: ./installer/install_python.ps1

      # G13
      - name: G13 Build Windeep with PyInstaller
        shell: pwsh
        run: pyinstaller --clean --noconfirm Windeep.spec

      - name: Stage release runtime and tools into onedir build
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist\Windeep\Windeep.exe')) {
            throw 'PyInstaller did not produce dist\Windeep\Windeep.exe'
          }
          Copy-Item -LiteralPath tools -Destination dist\Windeep\tools -Recurse -Force
          Copy-Item -LiteralPath runtime -Destination dist\Windeep\runtime -Recurse -Force
          Copy-Item -LiteralPath installer\tools-manifest.json -Destination dist\Windeep\tools-manifest.json -Force

      # G14
      - name: G14 Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }
          & $iscc "/DMyAppVersion=$env:WINDEEP_VERSION" installer\BugBountyInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      # G15
      - name: G15 Create portable ZIP
        shell: pwsh
        run: |
          $portable = 'dist\Windeep-Portable.zip'
          Remove-Item -LiteralPath $portable -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path 'dist\Windeep\*' -DestinationPath $portable -CompressionLevel Optimal -Force

      - name: Verify installer and portable build on clean runner
        shell: pwsh
        run: ./scripts/audit/windows_install_audit.ps1

      # G16
      - name: G16 Create source snapshot
        shell: pwsh
        run: |
          $output = "dist/windeep-source-v$env:WINDEEP_VERSION.zip"
          git archive --format=zip --output=$output HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          cyclonedx-py requirements requirements.txt --output-format JSON --outfile dist\SBOM.json
          if ($LASTEXITCODE -ne 0) { throw 'CycloneDX SBOM generation failed' }
          python scripts/release/enrich_sbom.py dist\SBOM.json

      - name: Stage release audit reports
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\reports -Force | Out-Null
          $required = @(
            'reports\static_audit.md',
            'reports\tool_liveness.md',
            'reports\windows_install_audit.md',
            'reports\release_gate.json'
          )
          foreach ($report in $required) {
            if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
              throw "Required release report missing: $report"
            }
            Copy-Item -LiteralPath $report -Destination dist\reports\ -Force
          }

      # G17
      - name: G17 Generate SHA256SUMS.txt over current dist artifacts
        shell: pwsh
        run: |
          $dist = (Resolve-Path dist).Path
          $files = @(Get-ChildItem -LiteralPath dist -File -Recurse | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object FullName)
          if ($files.Count -eq 0) { throw 'No dist artifacts exist to checksum' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($dist, $file.FullName).Replace('\', '/')
            "$hash  $relative"
          }
          $lines | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii

      # G18
      - name: G18 Generate release notes from CHANGELOG and Git history
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $env:WINDEEP_VERSION
          $previous = $null
          try {
            $previous = (git describe --tags --abbrev=0 "$tag^" 2>$null).Trim()
          } catch { $previous = $null }
          if ($LASTEXITCODE -ne 0) { $previous = $null; $global:LASTEXITCODE = 0 }
          $range = if ($previous) { "$previous..$tag" } else { $tag }
          $log = @(git log $range --pretty=format:'- `%h` %s')
          if ($LASTEXITCODE -ne 0) { throw 'git log failed while generating release notes' }
          $changelog = Get-Content CHANGELOG.md -Raw
          $notes = @(
            "# Windeep v$version",
            '',
            '## Changelog',
            '',
            $changelog.Trim(),
            '',
            "## Git history ($range)",
            ''
          ) + $log + @(
            '',
            '## Verification',
            '',
            '- Verify every downloaded asset against `SHA256SUMS.txt`.',
            '- Verify GitHub artifact attestations with `gh attestation verify <asset> --repo aprashnasuraj-dev/winddeep`.',
            '- Review the attached static, tool-liveness, Windows-install, and release-gate reports before use.'
          )
          $notes | Set-Content -LiteralPath dist\RELEASE-NOTES.md -Encoding utf8

      - name: Refresh SHA256SUMS after release-note generation
        shell: pwsh
        run: |
          $dist = (Resolve-Path dist).Path
          $files = @(Get-ChildItem -LiteralPath dist -File -Recurse | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object FullName)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath($dist, $file.FullName).Replace('\', '/')
            "$hash  $relative"
          }
          $lines | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii

      # G19
      - name: G19 Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE-NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/Windeep-Setup.exe
            dist/Windeep-Portable.zip
            dist/windeep-source-v*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/reports/static_audit.md
            dist/reports/tool_liveness.md
            dist/reports/windows_install_audit.md
            dist/reports/release_gate.json

      # G20
      - name: G20 Attach SBOM.json to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME dist\SBOM.json --clobber

      # G21: GitHub's Sigstore-backed artifact attestation provides a signed,
      # verifiable provenance statement for all final release assets.
      - name: G21 Sign release assets with GitHub artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/Windeep-Setup.exe
            dist/Windeep-Portable.zip
            dist/windeep-source-v*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/SBOM.json
            dist/reports/static_audit.md
            dist/reports/tool_liveness.md
            dist/reports/windows_install_audit.md
            dist/reports/release_gate.json

      - name: G21 Optional detached GPG signature for SHA256SUMS
        if: ${{ env.WINDEEP_GPG_PRIVATE_KEY_B64 != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release-key.asc", [Convert]::FromBase64String($env:WINDEEP_GPG_PRIVATE_KEY_B64))
          gpg --batch --import "$env:RUNNER_TEMP\release-key.asc"
          if ($LASTEXITCODE -ne 0) { throw 'GPG private-key import failed' }
          $args = @('--batch', '--yes', '--armor', '--detach-sign', '--output', 'dist\SHA256SUMS.txt.sig')
          if ($env:WINDEEP_GPG_PASSPHRASE) {
            $args += @('--pinentry-mode', 'loopback', '--passphrase', $env:WINDEEP_GPG_PASSPHRASE)
          }
          $args += 'dist\SHA256SUMS.txt'
          & gpg @args
          if ($LASTEXITCODE -ne 0) { throw 'GPG signing failed' }
          gh release upload $env:GITHUB_REF_NAME dist\SHA256SUMS.txt.sig --clobber
