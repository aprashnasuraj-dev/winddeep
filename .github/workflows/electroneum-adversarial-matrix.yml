name: ETN certified adversarial matrix (A-E)
on:
  workflow_dispatch:
    inputs:
      audit_class:
        description: 'Select one class or all five for a full verification'
        type: choice
        options: [ALL, A, B, C, D, E]
        default: ALL
  push:
    branches:
      - electroneum-sc-master-audit
    paths:
      - 'reports/electroneum/shared/adversarial_matrix.json'
      - 'reports/electroneum/shared/run_adversarial_matrix.py'
      - 'reports/electroneum/shared/test_signed_sequence_test.go'
      - '.github/workflows/electroneum-adversarial-matrix.yml'
      - 'reports/electroneum/*/PROBES.json'
      - 'reports/electroneum/B/verify_sync_patch.py'
      - 'reports/electroneum/*/*_test.go'
      - 'reports/electroneum/*/tests/*.go'
permissions:
  contents: read
concurrency:
  group: etn-adversarial-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      audit_matrix: ${{ steps.selection.outputs.audit_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select only the class touched by a push; all on shared changes
        id: selection
        shell: bash
        env:
          RUN_EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
          REQUESTED_CLASS: ${{ inputs.audit_class || 'ALL' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          owners = set("ABCDE")
          if os.environ["RUN_EVENT"] == "workflow_dispatch":
              requested = os.environ["REQUESTED_CLASS"]
              chosen = sorted(owners) if requested == "ALL" else [requested]
          else:
              before, head = os.environ["BEFORE_SHA"], os.environ["TRIGGER_SHA"]
              if not before or before == "0"*40:
                  chosen = sorted(owners)
              else:
                  paths = subprocess.check_output(
                      ["git", "diff", "--name-only", before, head],
                      text=True).splitlines()
                  global_change = any(
                      p.startswith("reports/electroneum/shared/") or
                      p == ".github/workflows/electroneum-adversarial-matrix.yml"
                      for p in paths)
                  touched = {p.split("/")[2] for p in paths
                             if p.startswith("reports/electroneum/") and
                             len(p.split("/")) > 3 and p.split("/")[2] in owners}
                  chosen = sorted(owners) if global_change or not touched else sorted(touched)
          assert chosen and all(c in owners for c in chosen)
          encoded = json.dumps(chosen, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("audit_matrix=" + encoded + "\n")
          print("ADVERSARIAL_SELECTED_LANES=" + encoded)
          PY

  certified-adversarial-regressions:
    needs: plan
    name: "Class ${{ matrix.audit }}: certified synthetic adversarial regression"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        audit: ${{ fromJSON(needs.plan.outputs.audit_matrix) }}
    steps:
      - name: Checkout exact audit branch for pinned Git source object
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize immutable certified Electroneum Git tree
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = "7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = "de7f3c75a2db7e87a89918f1257820703d5b731e"
          test -f "$WINDEEP_ETN_SOURCE/go.mod"
          echo "CERTIFIED_TARGET_READY class=${{ matrix.audit }} commit=$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT tree=$WINDEEP_ETN_SOURCE_TREE_SHA"
      - name: Install pinned Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Execute class probes and hash independent controls
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/shared/run_adversarial_matrix.py \
            --class "${{ matrix.audit }}" \
            --matrix reports/electroneum/shared/adversarial_matrix.json \
            --repeat 3 \
            --output "$RUNNER_TEMP/etn-adversarial-${{ matrix.audit }}"
      - name: Distinguish certified pre-fix miner pause from official repaired behavior
        if: matrix.audit == 'B'
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/B/verify_sync_patch.py \
            "$RUNNER_TEMP/etn-adversarial-B/scratch" \
            "$RUNNER_TEMP/etn-adversarial-B"
      - name: Publish machine-readable test evidence even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "etn-adversarial-${{ matrix.audit }}-${{ github.run_id }}"
          path: |
            ${{ runner.temp }}/etn-adversarial-${{ matrix.audit }}/*.json
            ${{ runner.temp }}/etn-adversarial-${{ matrix.audit }}/*.log
          if-no-files-found: warn
          retention-days: 14
