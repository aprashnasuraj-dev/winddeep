name: ETN Worker A certified supply campaign
on:
  push:
    branches: [electroneum-sc-master-audit]
    paths:
      - 'reports/electroneum/A/tests/**'
      - 'reports/electroneum/A/test_supply_journal_test.go'
      - '.github/workflows/electroneum-worker-a-ci.yml'
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: 'Go security fuzz budget in minutes (1..300)'
        type: number
        required: false
        default: 300
    inputs:
      fuzz_minutes:
        description: 'Sustained state-accounting fuzz budget (1..300 minutes)'
        required: false
        type: number
        default: 300
permissions:
  contents: read
concurrency:
  group: etn-worker-a-certified-campaign
  cancel-in-progress: false
jobs:
  supply:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: electroneum-sc-master-audit
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/electroneum-sc/go.mod
      - name: Certified bootstrap and adversarial state accounting campaign
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = 7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = de7f3c75a2db7e87a89918f1257820703d5b731e
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = 3aeb14db0d6384243302f3a025bdff904dc28bf6
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = 3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b
          echo "CERTIFIED_SOURCE=$WINDEEP_ETN_SOURCE"
          echo "SOURCE_TREE=$WINDEEP_ETN_SOURCE_TREE_SHA"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp -a "$WINDEEP_ETN_SOURCE/." "$scratch/"
          chmod -R u+w "$scratch"
          cp reports/electroneum/A/tests/supply_rollback_campaign_test.go "$scratch/core/state/worker_a_supply_campaign_test.go"
          cd "$scratch"
          echo "CAMPAIGN checkpoint=seeded_rollback seeds=2500"
          go test ./core/state -run '^TestWorkerASupplyRollbackCampaign$' -count=1 -timeout=45m -v
          echo "CAMPAIGN checkpoint=state_regressions"
          go test ./core/state -count=1 -timeout=45m
          echo "CAMPAIGN baseline_completed"
      - name: Sustained coverage-guided supply integrity fuzz (certified runtime)
        shell: bash
        env:
          AUDIT_FUZZ_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_minutes || '120' }}
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          minutes="$AUDIT_FUZZ_MINUTES"
          if ! [[ "$minutes" =~ ^[0-9]+$ ]] || (( minutes < 1 || minutes > 300 )); then
            echo "Invalid fuzz budget: $minutes"; exit 65
          fi
          echo "CAMPAIGN class=A phase=state-conservation-fuzz budget_minutes=$minutes"
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = 7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = de7f3c75a2db7e87a89918f1257820703d5b731e
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp -a "$WINDEEP_ETN_SOURCE/." "$scratch/"
          chmod -R u+w "$scratch"
          cp reports/electroneum/A/tests/supply_rollback_campaign_test.go "$scratch/core/state/worker_a_supply_campaign_test.go"
          cd "$scratch"
          go test -count=1 -parallel=2 -timeout=330m -fuzz='^FuzzWorkerAStateConservation

      - name: Prepare certified-source class A runtime fixture in disposable scratch
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WINDEEP_ETN_SOURCE:-}"
          scratch="$RUNNER_TEMP/worker-a-scratch"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/core/state"
          cp "reports/electroneum/A/test_supply_journal_test.go" "$scratch/core/state/worker_a_supply_journal_test.go"
          cd "$scratch"
          go test -count=1 -timeout=30m -run '^TestWorkerASupplyJournalRegression$' -v ./core/state
          echo "WORKER_A_ACTUAL_TARGET_RUNTIME_TEST_PASS"
      - name: Coverage-guided class A security fuzz campaign
        shell: bash
        env:
          AUDIT_FUZZ_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_minutes || '60' }}
        run: |
          set -euo pipefail
          minutes="$AUDIT_FUZZ_MINUTES"
          if ! [[ "$minutes" =~ ^[0-9]+$ ]] || (( minutes < 1 || minutes > 300 )); then
            echo "Invalid fuzz minute budget: $minutes (require 1..300)"; exit 65
          fi
          echo "CERTIFIED_CLASS_A_FUZZ_BEGIN minutes=$minutes source_commit=7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          cd "$RUNNER_TEMP/worker-a-scratch"
          go test -count=1 -parallel=2 -timeout=330m -fuzz='^FuzzWorkerASupplySnapshotJournal$' -fuzztime="${minutes}m" -v ./core/state
          echo "CERTIFIED_CLASS_A_FUZZ_PASS; minutes_requested=$minutes"
 -fuzztime="${minutes}m" -v ./core/state
          echo "CAMPAIGN class=A phase=state-conservation-fuzz completed"

      - name: Prepare certified-source class A runtime fixture in disposable scratch
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WINDEEP_ETN_SOURCE:-}"
          scratch="$RUNNER_TEMP/worker-a-scratch"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/core/state"
          cp "reports/electroneum/A/test_supply_journal_test.go" "$scratch/core/state/worker_a_supply_journal_test.go"
          cd "$scratch"
          go test -count=1 -timeout=30m -run '^TestWorkerASupplyJournalRegression$' -v ./core/state
          echo "WORKER_A_ACTUAL_TARGET_RUNTIME_TEST_PASS"
      - name: Coverage-guided class A security fuzz campaign
        shell: bash
        env:
          AUDIT_FUZZ_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_minutes || '60' }}
        run: |
          set -euo pipefail
          minutes="$AUDIT_FUZZ_MINUTES"
          if ! [[ "$minutes" =~ ^[0-9]+$ ]] || (( minutes < 1 || minutes > 300 )); then
            echo "Invalid fuzz minute budget: $minutes (require 1..300)"; exit 65
          fi
          echo "CERTIFIED_CLASS_A_FUZZ_BEGIN minutes=$minutes source_commit=7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          cd "$RUNNER_TEMP/worker-a-scratch"
          go test -count=1 -parallel=2 -timeout=330m -fuzz='^FuzzWorkerASupplySnapshotJournal$' -fuzztime="${minutes}m" -v ./core/state
          echo "CERTIFIED_CLASS_A_FUZZ_PASS; minutes_requested=$minutes"
