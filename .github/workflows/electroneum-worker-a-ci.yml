name: ETN Worker A certified supply campaign
on:
  push:
    branches: [electroneum-sc-master-audit]
    paths:
      - 'reports/electroneum/A/tests/**'
      - 'reports/electroneum/A/test_supply_journal_test.go'
      - 'reports/electroneum/A/test_fee_accounting_runtime_test.go'
      - '.github/workflows/electroneum-worker-a-ci.yml'
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: 'Total Go fuzz campaign budget in minutes (1..300)'
        type: number
        required: false
        default: 300
permissions:
  contents: read
  statuses: write
concurrency:
  group: etn-worker-a-certified-campaign
  cancel-in-progress: false
jobs:
  supply:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: electroneum-sc-master-audit
          fetch-depth: 0
          persist-credentials: false
      - name: Publish class A CI run ID for scheduled audit monitor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/electroneum_ci_status.sh A start
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/electroneum-sc/go.mod
      - name: Certified bootstrap and adversarial state accounting campaign
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = 7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = de7f3c75a2db7e87a89918f1257820703d5b731e
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = 3aeb14db0d6384243302f3a025bdff904dc28bf6
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = 3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b
          echo "CERTIFIED_SOURCE=$WINDEEP_ETN_SOURCE"
          echo "SOURCE_TREE=$WINDEEP_ETN_SOURCE_TREE_SHA"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp -a "$WINDEEP_ETN_SOURCE/." "$scratch/"
          chmod -R u+w "$scratch"
          cp reports/electroneum/A/tests/supply_rollback_campaign_test.go "$scratch/core/state/worker_a_supply_campaign_test.go"
          cd "$scratch"
          echo "CAMPAIGN checkpoint=seeded_rollback seeds=2500"
          go test ./core/state -run '^TestWorkerASupplyRollbackCampaign$' -count=1 -timeout=45m -v
          echo "CAMPAIGN checkpoint=state_regressions"
          go test ./core/state -count=1 -timeout=45m
          echo "CAMPAIGN baseline_completed"
      - name: Run two independent Go supply regression suites in scratch
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = 7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = de7f3c75a2db7e87a89918f1257820703d5b731e
          scratch="$RUNNER_TEMP/worker-a-scratch"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/core/state"
          cp reports/electroneum/A/tests/supply_rollback_campaign_test.go "$scratch/core/state/worker_a_supply_campaign_test.go"
          cp reports/electroneum/A/test_supply_journal_test.go "$scratch/core/state/worker_a_supply_journal_test.go"
          echo "WORKER_A_SCRATCH=$scratch" >> "$GITHUB_ENV"
          cd "$scratch"
          go test -count=1 -timeout=30m -run '^TestWorkerA' -v ./core/state
          echo "WORKER_A_RUNTIME_REGRESSION_PASS"
      - name: Certified EVM fee burn revert and priority waiver accounting oracle
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$WORKER_A_SCRATCH/core"
          cp reports/electroneum/A/test_fee_accounting_runtime_test.go "$WORKER_A_SCRATCH/core/worker_a_fee_accounting_test.go"
          cd "$WORKER_A_SCRATCH"
          go test -count=1 -timeout=12m -run TestWorkerAFeeAndBurnStateTransition -v ./core
          echo WORKER_A_REAL_EVM_FEE_ACCOUNTING_PASS
      - name: Targeted 2^64 fee escrow independent ledger (six actual EVM cases)
        shell: bash
        run: |
          set -euo pipefail
          cat > "$WORKER_A_SCRATCH/core/worker_a_fee_64_boundary_test.go" <<'GO_TEST'
          package core
          import (
           "math/big"
           "testing"
           "github.com/electroneum/electroneum-sc/common"
           "github.com/electroneum/electroneum-sc/core/types"
          )
          func TestWorkerAFeeCap64Boundary(t *testing.T) {
           q:=new(big.Int).Div(new(big.Int).Lsh(big.NewInt(1),64),big.NewInt(21000))
           for _,offset:=range []int64{-1,0,1} {
            cap:=new(big.Int).Add(q,big.NewInt(offset))
            escrow:=new(big.Int).Mul(cap,big.NewInt(21000))
            for _,funded:=range []bool{true,false} {
             evm,st,sender,to,miner:=workerAFeeEVM(t)
             initial:=new(big.Int).Add(escrow,big.NewInt(1000000))
             if !funded {initial.Sub(escrow,big.NewInt(1))}
             st.SetBalance(sender,initial)
             msg:=types.NewMessage(sender,&to,0,big.NewInt(0),21000,big.NewInt(10),cap,big.NewInt(2),nil,nil,true,common.PublicKey{})
             res,err:=ApplyMessage(evm,msg,new(GasPool).AddGas(21000))
             if !funded {
              if err==nil||res!=nil {t.Fatalf("offset=%d unfunded accepted result=%v err=%v",offset,res,err)}
              if st.GetBalance(sender).Cmp(initial)!=0||st.GetBalance(miner).Sign()!=0 {t.Fatalf("offset=%d rejected mutation",offset)}
              t.Logf("REJECT offset=%d escrow=%s",offset,escrow);continue
             }
             if err!=nil||res==nil||res.Failed()||res.UsedGas!=21000 {t.Fatalf("offset=%d unexpected result=%v err=%v",offset,res,err)}
             debit:=big.NewInt(210000);burn:=big.NewInt(168000);tip:=big.NewInt(42000)
             wantSender:=new(big.Int).Sub(initial,debit)
             if st.GetBalance(sender).Cmp(wantSender)!=0||st.GetBalance(miner).Cmp(tip)!=0||st.GetBalance(to).Sign()!=0 {t.Fatalf("offset=%d ledger mismatch sender=%s miner=%s",offset,st.GetBalance(sender),st.GetBalance(miner))}
             sum:=new(big.Int).Add(st.GetBalance(sender),st.GetBalance(miner))
             if sum.Cmp(new(big.Int).Sub(initial,burn))!=0 {t.Fatalf("offset=%d burn mismatch",offset)}
             if new(big.Int).Add(tip,burn).Cmp(debit)!=0 {t.Fatal("oracle arithmetic mismatch")}
             t.Logf("PASS offset=%d escrow=%s actual_fee=%s burn=%s tip=%s",offset,escrow,debit,burn,tip)
            }
           }
          }
          GO_TEST
          cd "$WORKER_A_SCRATCH"
          go version
          go test -count=1 -timeout=10m -run '^TestWorkerAFeeCap64Boundary$' -v ./core
          echo WORKER_A_FEE64_BOUNDARY_COMPLETE

      - name: Publish class A final CI outcome
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: bash tools/electroneum_ci_status.sh A finish
