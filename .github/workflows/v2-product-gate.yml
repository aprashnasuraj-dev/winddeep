name: Windeep v3 Product Gate

on:
  push:
    branches: [v2/product-overhaul]
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/audit/**'
      - 'scripts/migrate_v2_overhaul.py'
      - 'scripts/migrate_v2_ui_selection.py'
      - 'tools_config.json'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'RELEASE_CHECKLIST.md'

permissions:
  contents: write

jobs:
  v3-product:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      WINDEEP_NO_BROWSER: '1'
      WINDEEP_PORT: '7332'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply deterministic v2 migration
        run: |
          python scripts/migrate_v2_overhaul.py
          python scripts/migrate_v2_ui_selection.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify catalog, packaging, and v3 release contracts
        run: |
          python scripts/audit/release_audit.py --phase A
          python scripts/audit/release_audit.py --phase B
          python scripts/audit/release_audit.py --phase V3

      - name: Run complete unit and product regression suite
        run: python -m pytest -q --cov=app --cov=launcher --cov-report=term-missing --cov-report=xml:reports/coverage-v2.xml --cov-fail-under=85

      - name: Enforce v3 release-module coverage
        run: >-
          python scripts/audit/check_v3_coverage.py reports/coverage-v2.xml
          app/v3/api.py app/v3/events.py app/v3/triage.py app/v3/reporting.py --minimum 90

      - name: Install Chromium for UI audit
        run: python -m playwright install --with-deps chromium

      - name: Launch local Windeep server
        shell: bash
        run: |
          export WINDEEP_STATE_DIR="$RUNNER_TEMP/windeep-v3-ui-state"
          python -m app.server > "$RUNNER_TEMP/windeep-v3-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/windeep-v3-server.pid"
          for i in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${WINDEEP_PORT}/api/health" >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/windeep-v3-server.log"
          exit 1

      - name: Verify every primary v3 UI workflow
        run: python scripts/audit/ui_v2_smoke.py

      - name: Show server log on failure
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/windeep-v3-server.log" || true

      - name: Commit verified generated migration
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git add -u -- app/engine/tool_wrapper.py app/server.py app/static/app.js app/tools/config
          if git diff --cached --quiet; then
            echo "No generated migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(v2): activate cancellable target-aware 137-tool runtime"
          git push origin HEAD:v2/product-overhaul
