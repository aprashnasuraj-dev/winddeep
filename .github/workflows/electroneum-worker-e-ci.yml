name: Electroneum Worker E certified RPC canonicality
on:
  push:
    branches: [electroneum-sc-master-audit]
    paths:
      - .github/workflows/electroneum-worker-e-ci.yml
      - reports/electroneum/E/test_canonical_lookup_test.go
      - reports/electroneum/E/mutation_oracle.py
      - tools/electroneum_target_bootstrap.sh
      - reports/electroneum/TARGET_CERTIFICATE.json
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: 'Sustained coverage-guided testing budget, 1..300 minutes'
        type: number
        required: false
        default: 300
permissions:
  contents: read
  statuses: write
concurrency:
  group: etn-worker-e-certified-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker-e-canonicality:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout audit branch and certified Git object
        uses: actions/checkout@v4
        with:
          ref: electroneum-sc-master-audit
          fetch-depth: 0
          persist-credentials: false
      - name: Publish class E CI run ID for scheduled audit monitor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/electroneum_ci_status.sh E start
      - name: Bootstrap immutable certified source
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = "7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = "de7f3c75a2db7e87a89918f1257820703d5b731e"
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = "3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b"
          printf 'CERTIFIED_E_SOURCE=%s\n' "$WINDEEP_ETN_SOURCE"
          printf 'WINDEEP_ETN_SOURCE=%s\n' "$WINDEEP_ETN_SOURCE" >> "$GITHUB_ENV"
          printf 'ETN_WORKER_E_BOOTSTRAP_PASS\n'
      - name: Setup Go from certified source version
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Prepare isolated scratch test copy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WINDEEP_ETN_SOURCE:-}"
          scratch="$RUNNER_TEMP/worker-e-scratch"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/core/rawdb" "$scratch/core/rawdb/accessors_indexes.go"
          cp reports/electroneum/E/test_canonical_lookup_test.go "$scratch/core/rawdb/worker_e_canonical_lookup_test.go"
          echo "ETN_E_SCRATCH=$scratch" >> "$GITHUB_ENV"
          sha256sum "$WINDEEP_ETN_SOURCE/core/rawdb/accessors_indexes.go" > "$RUNNER_TEMP/worker-e-immutable-source.sha256"
          printf 'WORKER_E_SCRATCH_ONLY_PASS\n'
      - name: Execute actual Electroneum rawdb transaction/receipt reorg tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$ETN_E_SCRATCH"
          go test -count=1 -timeout=8m -run '^TestWorkerE' -v ./core/rawdb
          echo "WORKER_E_TARGET_RUNTIME_BASELINE_PASS"
      - name: Inject intentionally broken canonical lookup and require test rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/reports/electroneum/E/mutation_oracle.py" "$ETN_E_SCRATCH" inject
          cd "$ETN_E_SCRATCH"
          set +e
          go test -count=1 -timeout=8m -run '^TestWorkerE' -v ./core/rawdb 2>&1 | tee "$RUNNER_TEMP/worker-e-mutant.log"
          result="${PIPESTATUS[0]}"
          set -e
          if [ "$result" -eq 0 ]; then
            echo "MUTATION_NOT_DETECTED: weakened canonical lookup unexpectedly passed"
            exit 80
          fi
          grep -q 'canonical transaction mismatch' "$RUNNER_TEMP/worker-e-mutant.log" || {
            echo "MUTATION_INVALID: test failed without expected canonicality assertion"; exit 81;
          }
          echo "WORKER_E_CANONICAL_MUTATION_REJECTED"
          cd "$GITHUB_WORKSPACE"
          python3 reports/electroneum/E/mutation_oracle.py "$ETN_E_SCRATCH" restore
      - name: Re-run restored code and assert certified source unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd "$ETN_E_SCRATCH"
          go test -count=1 -timeout=8m -run '^TestWorkerE' -v ./core/rawdb
          cd "$GITHUB_WORKSPACE"
          sha256sum --check "$RUNNER_TEMP/worker-e-immutable-source.sha256"
          echo "WORKER_E_CANONICALITY_TESTS_PASS"
      # No artifact upload: evidence is retained in GitHub Actions step logs.

      - name: Coverage-guided class E security fuzz campaign
        shell: bash
        env:
          AUDIT_FUZZ_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_minutes || '60' }}
        run: |
          set -euo pipefail
          minutes="$AUDIT_FUZZ_MINUTES"
          if ! [[ "$minutes" =~ ^[0-9]+$ ]] || (( minutes < 1 || minutes > 300 )); then
            echo "Invalid fuzz minute budget: $minutes (require 1..300)"; exit 65
          fi
          echo "CERTIFIED_CLASS_E_FUZZ_BEGIN minutes=$minutes source_commit=7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          cd "$ETN_E_SCRATCH"
          go test -count=1 -parallel=2 -timeout=330m -fuzz='^FuzzWorkerEReorgLookup$' -fuzztime="${minutes}m" -v ./core/rawdb
          echo "CERTIFIED_CLASS_E_FUZZ_PASS; minutes_requested=$minutes"

      - name: Publish class E final CI outcome
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: bash tools/electroneum_ci_status.sh E finish
