name: ETN independent validator governance RPC proof
on:
  push:
    branches: [etn-independent-governance-proof-20261106]
    paths:
      - .github/workflows/etn-independent-governance-proof.yml
      - reports/electroneum/B/test_independent_governance_rpc_test.go
permissions:
  contents: read
  statuses: write
concurrency:
  group: etn-independent-governance
  cancel-in-progress: false
jobs:
  governance-loopback-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap certified source
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = "7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = "de7f3c75a2db7e87a89918f1257820703d5b731e"
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = "3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b"
          echo "ETN_GOV_SOURCE=$WINDEEP_ETN_SOURCE" >> "$GITHUB_ENV"
          echo "ETN_GOVERNANCE_CERTIFIED_SOURCE_PASS"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Install isolated synthetic HTTP proof into scratch tree
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/etn-governance-scratch"
          mkdir -p "$scratch"
          cp -a "$ETN_GOV_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/consensus/istanbul/backend"
          cp "$GITHUB_WORKSPACE/reports/electroneum/B/test_independent_governance_rpc_test.go" "$scratch/consensus/istanbul/backend/etn_governance_rpc_test.go"
          echo "ETN_GOV_SCRATCH=$scratch" >> "$GITHUB_ENV"
      - name: Repeat authenticated-context negative control and unauthorized proposal propagation
        shell: bash
        run: |
          set -euo pipefail
          cd "$ETN_GOV_SCRATCH"
          go test -count=3 -timeout=8m -run '^TestIndependent(IstanbulUnauthenticatedVoteInjection|GovernanceRPCCommitsUnauthorizedValidatorChange)$' -v ./consensus/istanbul/backend 2>&1 | tee "$RUNNER_TEMP/etn-governance-proof.log"
          grep -q ETN_GOVERNANCE_UNAUTHENTICATED_HTTP_PROPOSE_SUCCEEDED "$RUNNER_TEMP/etn-governance-proof.log"
          grep -q ETN_GOVERNANCE_UNAUTHENTICATED_VOTE_WRITTEN_TO_QBFT_HEADER "$RUNNER_TEMP/etn-governance-proof.log"
          grep -q ETN_GOVERNANCE_UNAUTHENTICATED_HTTP_DISCARD_SUCCEEDED "$RUNNER_TEMP/etn-governance-proof.log"
          grep -q ETN_GOVERNANCE_UNAUTHENTICATED_CANONICAL_VALIDATOR_ADDITION_CONFIRMED "$RUNNER_TEMP/etn-governance-proof.log"
          echo "ETN_GOVERNANCE_CERTIFIED_TARGET_PROOF_PASS"
      - name: Store bounded proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etn-governance-loopback-proof
          path: ${{ runner.temp }}/etn-governance-proof.log
          if-no-files-found: ignore
