name: Electroneum Worker C certified signing regression
on:
  push:
    branches: [electroneum-sc-master-audit]
    paths:
      - .github/workflows/electroneum-worker-c-ci.yml
      - reports/electroneum/C/test_signing_domain_test.go
      - reports/electroneum/C/test_keystore_kdf_test.go
      - tools/electroneum_target_bootstrap.sh
      - reports/electroneum/TARGET_CERTIFICATE.json
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: 'Sustained coverage-guided testing budget, 1..300 minutes'
        type: number
        required: false
        default: 300
permissions:
  contents: read
  statuses: write
concurrency:
  group: etn-worker-c-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker-c-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: electroneum-sc-master-audit
          fetch-depth: 0
          persist-credentials: false
      - name: Publish class C CI run ID for scheduled audit monitor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/electroneum_ci_status.sh C start
      - name: Bootstrap immutable certified source
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = "7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = "de7f3c75a2db7e87a89918f1257820703d5b731e"
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = "3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b"
          echo "WORKER_C_CERTIFIED_SOURCE_PASS"
          echo "WINDEEP_ETN_SOURCE=$WINDEEP_ETN_SOURCE" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Run certified transaction-signing suite in isolated scratch copy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WINDEEP_ETN_SOURCE:-}"
          scratch="$RUNNER_TEMP/worker-c-scratch"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/core/types"
          cp reports/electroneum/C/test_signing_domain_test.go "$scratch/core/types/worker_c_signing_domain_test.go"
          cd "$scratch"
          go test -count=1 -timeout=8m -run '^TestWorkerCChainDomainAndAuthorization$' -v ./core/types
          echo "WORKER_C_TARGET_RUNTIME_TEST_PASS"
      - name: Characterize malformed encrypted keystore JSON in certified scratch
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/worker-c-scratch"
          test -f "$scratch/go.mod"
          chmod u+w "$scratch/accounts/keystore"
          cp reports/electroneum/C/test_keystore_kdf_test.go "$scratch/accounts/keystore/worker_c_kdf_test.go"
          cd "$scratch"
          go test -count=1 -timeout=8m -run '^(TestWorkerCKDFMalformedInputCharacterization|TestWorkerCImportMaliciousJSON)$' -v ./accounts/keystore
          echo "WORKER_C_KEYSTORE_CHARACTERIZATION_AND_IMPORT_PASS"

      - name: Coverage-guided class C security fuzz campaign
        shell: bash
        env:
          AUDIT_FUZZ_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_minutes || '60' }}
        run: |
          set -euo pipefail
          minutes="$AUDIT_FUZZ_MINUTES"
          if ! [[ "$minutes" =~ ^[0-9]+$ ]] || (( minutes < 1 || minutes > 300 )); then
            echo "Invalid fuzz minute budget: $minutes (require 1..300)"; exit 65
          fi
          echo "CERTIFIED_CLASS_C_FUZZ_BEGIN minutes=$minutes source_commit=7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          cd "$RUNNER_TEMP/worker-c-scratch"
          go test -count=1 -parallel=2 -timeout=330m -fuzz='^FuzzWorkerCTransactionBinding$' -fuzztime="${minutes}m" -v ./core/types
          echo "CERTIFIED_CLASS_C_FUZZ_PASS; minutes_requested=$minutes"

      - name: Publish class C final CI outcome
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: bash tools/electroneum_ci_status.sh C finish
