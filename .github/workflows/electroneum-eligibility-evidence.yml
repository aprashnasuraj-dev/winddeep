name: ETN A-E Eligibility Evidence Gate
on:
  push:
    branches: [audit/eligibility-20261104]
    paths:
      - 'reports/electroneum/eligibility/**'
      - '.github/workflows/electroneum-eligibility-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etn-eligibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and materialize certified source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = "7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = "de7f3c75a2db7e87a89918f1257820703d5b731e"
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = "3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b"
          echo "WINDEEP_ETN_SOURCE=$WINDEEP_ETN_SOURCE" >> "$GITHUB_ENV"
          echo ELIGIBILITY_CERTIFIED_SOURCE_PASS
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Mount test fixtures into isolated scratch source
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/eligibility-scratch"
          mkdir -p "$scratch" "$RUNNER_TEMP/eligibility-evidence"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          for dir in eth internal/ethapi eth/filters consensus/istanbul/core consensus/istanbul/engine accounts/keystore core; do chmod u+w "$scratch/$dir"; done
          cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/eligibility_full_backend_helper_test.go"
          cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/eligibility_peer_downloader_helper_test.go"
          cp reports/electroneum/eligibility/e004_e008_production_controls_test.go "$scratch/eth/eligibility_e004_e008_test.go"
          cp reports/electroneum/eligibility/e002_fee_admission_test.go "$scratch/internal/ethapi/eligibility_fee_cap_test.go"
          cp reports/electroneum/C/reverse/reverse_e_rpc_header_test.go "$scratch/internal/ethapi/eligibility_nil_header_test.go"
          cp reports/electroneum/C/reports/fixtures/reverse_e_log_range_test.go "$scratch/eth/filters/eligibility_logs_test.go"
          cp reports/electroneum/C/reports/fixtures/reverse_b_round_reachability_test.go "$scratch/consensus/istanbul/core/eligibility_round_core_test.go"
          cp reports/electroneum/C/reports/fixtures/reverse_b_round32_seal_test.go "$scratch/consensus/istanbul/engine/eligibility_round_seal_test.go"
          cp reports/electroneum/C/reports/fixtures/reverse_c_import_boundary_test.go "$scratch/accounts/keystore/eligibility_import_test.go"
          cp reports/electroneum/C/reports/fixtures/reverse_d_header_restart_test.go "$scratch/core/eligibility_finalized_test.go"
          echo "ELIGIBILITY_SCRATCH=$scratch" >> "$GITHUB_ENV"
          echo ELIGIBILITY_FIXTURE_INSTALL_PASS
      - name: E004 downloader-to-receipt-to-third-party decision
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$ELIGIBILITY_SCRATCH"
          go test -count=1 -timeout=14m -run '^TestEligibilityE004DownloaderTriggeredStaleReceiptDecision$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/eligibility-evidence/e004.log"
          grep -Fq 'ELIGIBILITY_E004_DOWNLOADER_STALE_RECEIPT_CONFIRMED' "$RUNNER_TEMP/eligibility-evidence/e004.log"
          grep -Fq 'ELIGIBILITY_E004_UNSAFE_CONSUMER_FALSE_CREDIT_SIMULATED naive_credit=true canonical_aware_credit=false' "$RUNNER_TEMP/eligibility-evidence/e004.log"
          grep -Fq 'ELIGIBILITY_E004_COMPLETED_REORG_NEGATIVE_CONTROL_PASS' "$RUNNER_TEMP/eligibility-evidence/e004.log"
      - name: E008 real backend header continuity vs injected gap
        shell: bash
        run: |
          set -euo pipefail
          cd "$ELIGIBILITY_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestEligibilityE008CoherentBackendHeadersAcrossFork$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/eligibility-evidence/e008-real.log"
          grep -Fq 'ELIGIBILITY_E008_COHERENT_FULL_BACKEND_HEADER_RANGE_PASS' "$RUNNER_TEMP/eligibility-evidence/e008-real.log"
          go test -count=1 -timeout=10m -run '^TestReverseELogRangeDefenseMatrix$' -v ./eth/filters 2>&1 | tee "$RUNNER_TEMP/eligibility-evidence/e008-gap.log"
          grep -Fq 'REVERSE_E_LOG_MISSING_MIDDLE_SILENT_PARTIAL_OBSERVED' "$RUNNER_TEMP/eligibility-evidence/e008-gap.log"
      - name: E002 oversized gas price admission counterexample
        shell: bash
        run: |
          set -euo pipefail
          cd "$ELIGIBILITY_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestEligibilityE002HighFeeDefaultAdmissionControls$' -v ./internal/ethapi 2>&1 | tee "$RUNNER_TEMP/eligibility-evidence/e002.log"
          grep -Fq 'ELIGIBILITY_E002_DEFAULT_RPC_CAP_REJECTS_HIGH_FEE_PASS' "$RUNNER_TEMP/eligibility-evidence/e002.log"
      - name: E010 nil-header bug with positive controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$ELIGIBILITY_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseEReceiptDefenseMatrix$' -v ./internal/ethapi 2>&1 | tee "$RUNNER_TEMP/eligibility-evidence/e010.log"
          grep -Fq 'REVERSE_E_RUNTIME_NIL_HEADER_PANIC_OBSERVED' "$RUNNER_TEMP/eligibility-evidence/e010.log"
      - name: B consensus round boundaries and admission controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$ELIGIBILITY_SCRATCH"
          go test -count=1 -timeout=10m -run '^(TestReverseBRoundAliasReachability|TestReverseBRound63ReconstructionReachability|TestReverseB32AdmissionBarrier)$' -v ./consensus/istanbul/core 2>&1 | tee "$RUNNER_TEMP/eligibility-evidence/b-core.log"
          grep -Fq 'REVERSE_B32_FPLUS1_IMMEDIATE_ADMISSION_BLOCKED_PASS' "$RUNNER_TEMP/eligibility-evidence/b-core.log"
          go test -count=1 -timeout=10m -run '^TestReverseB32CommittedSealDomain$' -v ./consensus/istanbul/engine 2>&1 | tee "$RUNNER_TEMP/eligibility-evidence/b-seal.log"
          grep -Fq 'REVERSE_B32_SIGNED_SEAL_DOMAIN_ALIAS_CONFIRMED' "$RUNNER_TEMP/eligibility-evidence/b-seal.log"
      - name: C and D non-payout root causes
        shell: bash
        run: |
          set -euo pipefail
          cd "$ELIGIBILITY_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseCExportedKeyStoreImportMatrix$' -v ./accounts/keystore 2>&1 | tee "$RUNNER_TEMP/eligibility-evidence/c-import.log"
          grep -Fq 'REVERSE_C_EXPORTED_IMPORT_PANIC_OBSERVED' "$RUNNER_TEMP/eligibility-evidence/c-import.log"
          go test -count=1 -timeout=12m -run '^TestReverseDHeaderRollbackRestart/finalized_pointer_after_explicit_admin_rewind$' -v ./core 2>&1 | tee "$RUNNER_TEMP/eligibility-evidence/d-rewind.log"
          grep -Fq 'REVERSE_D_STALE_FINALIZED_POINTER_OBSERVED' "$RUNNER_TEMP/eligibility-evidence/d-rewind.log"
      - name: Confirm target source unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- vendor/electroneum-sc
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo ELIGIBILITY_SOURCE_UNMODIFIED_PASS
      - name: Preserve exact logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etn-eligibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eligibility-evidence/
          if-no-files-found: warn
          retention-days: 14
