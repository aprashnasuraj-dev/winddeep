name: TransferWise Audit Readiness

on:
  push:
    branches: [transferwise]
    paths:
      - '.github/workflows/transferwise-readiness.yml'
      - 'scripts/audit/transferwise_workspace.py'
      - 'tests/test_transferwise_workspace.py'
      - 'transferwise/tooling/**'
      - 'transferwise/AUDIT_SYSTEM.md'
      - 'config/programs/transferwise_github.json'
      - '.devcontainer/**'
      - 'requirements-audit.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transferwise-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-preflight-and-proof-packaging:
    if: github.repository == 'aprashnasuraj-dev/winddeep' && github.ref == 'refs/heads/transferwise'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect five lanes and optional toolchains
        run: python scripts/audit/transferwise_workspace.py doctor --check
      - name: Run offline package acceptance and rejection tests
        run: python -m unittest discover -s tests -p test_transferwise_workspace.py -v
