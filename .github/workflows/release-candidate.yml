name: Release Candidate Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Phase A static audit
        run: python scripts/audit/release_audit.py --phase A

      - name: Phase B manifest audit
        run: python scripts/audit/release_audit.py --phase B

      - name: Phase E dependency audit
        run: python scripts/audit/release_audit.py --phase E

      - name: Pytest and coverage
        run: python -m pytest -q --cov=app --cov=launcher --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=85

      - name: Phase D end-to-end audit
        run: python scripts/audit/release_audit.py --phase D

      - name: Phase F pre-tag release gate
        shell: pwsh
        run: |
          Remove-Item Env:GITHUB_REF_NAME -ErrorAction SilentlyContinue
          python scripts/audit/release_audit.py --phase F

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Stage certified portable tools
        shell: pwsh
        run: ./installer/setup_tools.ps1

      - name: Re-run Phase B with staged binaries
        run: python scripts/audit/release_audit.py --phase B

      - name: Bundle embedded Python and Playwright
        shell: pwsh
        run: ./installer/install_python.ps1

      - name: Build PyInstaller onedir
        run: pyinstaller --clean --noconfirm Windeep.spec

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc 'installer\BugBountyInstaller.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean Windows install audit
        shell: pwsh
        run: ./scripts/audit/windows_install_audit.ps1

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windeep-v0.1.0-candidate-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/*.md
            reports/*.json
            reports/coverage.xml
            dist/Windeep-Setup.exe
            dist/Windeep/**
