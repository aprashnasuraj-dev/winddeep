name: Release Candidate Gate

on:
  push:
    branches:
      - release/product-completion-v0.1.0
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-capture.txt

      - name: Install requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Phase A static audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase A
          if ($LASTEXITCODE -ne 0) { Get-Content reports/static_audit.md; exit $LASTEXITCODE }

      - name: Phase B packaging contract audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase B
          if ($LASTEXITCODE -ne 0) { Get-Content reports/tool_liveness.md; exit $LASTEXITCODE }

      - name: Phase E dependency audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase E
          if ($LASTEXITCODE -ne 0) { Get-Content reports/dependency_audit.md; exit $LASTEXITCODE }

      - name: Pytest and coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          python -m pytest -q --cov=app --cov=launcher --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=85

      - name: Phase D local end-to-end audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase D
          if ($LASTEXITCODE -ne 0) { Get-Content reports/e2e_audit.md; exit $LASTEXITCODE }

      - name: Phase F pre-tag release gate
        shell: pwsh
        env:
          GITHUB_REF_NAME: v0.1.0
        run: |
          python scripts/audit/release_audit.py --phase F
          if ($LASTEXITCODE -ne 0) { Get-Content reports/release_gate.json; exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Stage certified portable tools
        shell: pwsh
        run: |
          ./installer/setup_tools.ps1
          python scripts/audit/release_audit.py --phase B --require-installed
          if ($LASTEXITCODE -ne 0) { Get-Content reports/tool_liveness.md; exit $LASTEXITCODE }

      - name: Bundle embedded Python 3.11 and Playwright
        shell: pwsh
        run: ./installer/install_python.ps1

      - name: Bundle isolated capture Python 3.12 and mitmproxy
        shell: pwsh
        run: ./installer/install_capture_runtime.ps1

      - name: Verify capture runtime dependency health
        shell: pwsh
        run: |
          .\runtime\capture-python\python.exe -m pip check
          $version = (.\runtime\capture-python\Scripts\mitmdump.exe --version | Out-String)
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '12\.2\.3') { throw "Pinned capture runtime verification failed: $version" }

      - name: Build PyInstaller onedir
        shell: pwsh
        run: pyinstaller --clean --noconfirm Windeep.spec

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          $version = (Get-Content VERSION -Raw).Trim()
          & $iscc "/DMyAppVersion=$version" 'installer\BugBountyInstaller.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean Windows install and portable audit
        shell: pwsh
        run: |
          ./scripts/audit/windows_install_audit.ps1
          if ($LASTEXITCODE -ne 0) { Get-Content reports/windows_install_audit.md; exit $LASTEXITCODE }

      - name: Tag verified candidate and dispatch tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          if ($tag -ne 'v0.1.0') { throw "This promotion gate is locked to v0.1.0, found $tag" }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "Checkout SHA $head differs from workflow SHA $env:GITHUB_SHA" }
          git fetch --tags origin
          $direct = @(git ls-remote --tags origin "refs/tags/$tag")
          $peeled = @(git ls-remote --tags origin "refs/tags/$tag^{}")
          if ($direct.Count -gt 0) {
            $remoteSha = if ($peeled.Count -gt 0) { ($peeled[0] -split '\s+')[0] } else { ($direct[0] -split '\s+')[0] }
            if ($remoteSha -ne $head) { throw "Existing $tag points to $remoteSha instead of verified candidate $head" }
            Write-Host "$tag already points to verified candidate $head"
          } else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $tag -m "Windeep $tag verified release"
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to push release tag $tag" }
          }
          gh workflow run release.yml --ref $tag
          if ($LASTEXITCODE -ne 0) { throw "Failed to dispatch tagged release workflow for $tag" }
          Write-Host "Dispatched release.yml for $tag at $head"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windeep-v0.1.0-candidate-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/
            runtime/capture-requirements.lock
            dist/Windeep-Setup.exe
            dist/Windeep/**
