name: ETN 2026-11-05 head-binding and progress-event integration test
on:
  push:
    branches: [audit/downloader-head-hash-target-20261111]
    paths:
      - 'reports/electroneum/D/tests/audit_download_head_binding_test.go'
      - '.github/workflows/etn-download-head-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-exact-head-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/downloader-head-hash-target-20261111
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Fetch and verify exact official 2026-11-05 upstream source
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/electroneum-exact-master"
          mkdir -p "$target"
          git -C "$target" init -q
          git -C "$target" remote add origin https://github.com/electroneum/electroneum-sc.git
          git -C "$target" -c protocol.version=2 fetch --no-tags --depth=1 origin db0eb8792dd57304fbc66a60377c7663e1bd44d2
          git -C "$target" checkout --detach -q FETCH_HEAD
          test "$(git -C "$target" rev-parse HEAD)" = "db0eb8792dd57304fbc66a60377c7663e1bd44d2"
          test "$(git -C "$target" rev-parse HEAD^{tree})" = "b872b494d87ab289914afccd51d3599a6b88552a"
          echo "ETN_SOURCE_SHA=$(git -C "$target" rev-parse HEAD)"
          echo "ETN_SOURCE_TREE=$(git -C "$target" rev-parse HEAD^{tree})"
          echo "ETN_SOURCE=$target" >> "$GITHUB_ENV"
      - name: Target runtime test with wrong advertised head and blocked ancestry
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/etn-dl-head-binding"
          mkdir -p "$scratch"
          cp -a "$ETN_SOURCE"/. "$scratch"/
          cp reports/electroneum/D/tests/audit_download_head_binding_test.go "$scratch/eth/downloader/"
          cd "$scratch"
          go test -count=3 -timeout=12m -v -run '^TestAuditDownloaderFetchHeadAdvertisedHashBinding$' ./eth/downloader | tee "$RUNNER_TEMP/etn-head-binding.log"
          grep -q 'DOWNLOADER_HONEST_HEAD_MATCH' "$RUNNER_TEMP/etn-head-binding.log"
          grep -q 'DOWNLOADER_UNBOUND_HEAD_CONFIRMED' "$RUNNER_TEMP/etn-head-binding.log"
          grep -q 'DOWNLOADER_EMPTY_HEADER_REJECTED' "$RUNNER_TEMP/etn-head-binding.log"
          grep -q 'DOWNLOADER_UNBOUND_PROGRESS_EVENT' "$RUNNER_TEMP/etn-head-binding.log"
          grep -q 'DOWNLOADER_ANCESTRY_REQUEST_BLOCKED' "$RUNNER_TEMP/etn-head-binding.log"
          echo "CURRENT_MASTER_HEAD_AND_PROGRESS_REPRODUCED"
          {
            echo '## Evidence boundaries'
            echo '- Pinned upstream commit: db0eb8792dd57304fbc66a60377c7663e1bd44d2'
            echo '- Head hash mismatch admitted; ProgressEvent before ancestor verification'
            echo '- No miner instance, 4-validator chain, real network availability or severity proof'
          } >> "$GITHUB_STEP_SUMMARY"
