name: Electroneum Reverse Independent Audit R
on:
  push:
    branches: [electroneum-sc-master-audit]
    paths:
      - .github/workflows/electroneum-reverse-independent-ci.yml
      - 'reports/electroneum/C/reverse/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etn-reverse-independent-audit
  cancel-in-progress: false
jobs:
  reverse-e-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout audit branch at current HEAD
        uses: actions/checkout@v4
        with:
          ref: electroneum-sc-master-audit
          fetch-depth: 0
          persist-credentials: false
      - name: Validate certified immutable Electroneum source
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = '7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0'
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = 'de7f3c75a2db7e87a89918f1257820703d5b731e'
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = '3aeb14db0d6384243302f3a025bdff904dc28bf6'
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = '3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b'
          test -n "$WINDEEP_ETN_SOURCE"
          echo "WINDEEP_ETN_SOURCE=$WINDEEP_ETN_SOURCE" >> "$GITHUB_ENV"
          printf 'REVERSE_R_CERTIFIED_SOURCE_PASS source=%s\n' "$WINDEEP_ETN_SOURCE"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Copy immutable source to isolated R-only scratch and install E challenge
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/worker-r-scratch"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/internal/ethapi" "$scratch/internal/ethapi/api.go"
          cp reports/electroneum/C/reverse/reverse_e_rpc_header_test.go "$scratch/internal/ethapi/worker_r_reverse_e_test.go"
          test -f "$scratch/go.mod"
          echo "REVERSE_R_SCRATCH=$scratch" >> "$GITHUB_ENV"
          sha256sum "$WINDEEP_ETN_SOURCE/internal/ethapi/api.go" > "$RUNNER_TEMP/reverse-r-immutable.sha256"
          echo REVERSE_R_SCRATCH_PREPARED
      - name: Reverse pass - test production adapter defenses before its error path
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseEReceiptDefenseMatrix$' -v ./internal/ethapi
          echo REVERSE_R_E_VALID_NEGATIVE_AND_ADVERSARIAL_CONTROLS_PASS
      - name: Reverse oracle - demonstrate source violation rather than accidentally passing
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run '^TestReverseEFailClosedOracle$' -v ./internal/ethapi > "$RUNNER_TEMP/reverse-r-original.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reverse-r-original.log"
          if [ "$rc" -eq 0 ]; then echo 'REVERSE_R_EXPECTED_MISMATCH_NOT_DETECTED'; exit 65; fi
          grep -Fq 'REVERSE_E_FAIL_CLOSED_ORACLE_MISMATCH' "$RUNNER_TEMP/reverse-r-original.log" || { echo 'REVERSE_R_INVALID_NONSECURITY_FAILURE'; exit 66; }
          echo "REVERSE_R_ORIGINAL_SOURCE_ORACLE_REJECTED exit=$rc"
      - name: Scratch-only defensive guard sensitivity and restoration of source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/C/reverse/reverse_e_guard_patch.py "$REVERSE_R_SCRATCH/internal/ethapi/api.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseE' -v ./internal/ethapi
          cd "$GITHUB_WORKSPACE"
          sha256sum --check "$RUNNER_TEMP/reverse-r-immutable.sha256"
          echo REVERSE_R_E_GUARD_SENSITIVITY_AND_CERTIFIED_SOURCE_INTACT_PASS
      - name: Reverse second-last E item - exercise missing log header partial-response controls
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/eth/filters" "$REVERSE_R_SCRATCH/eth/filters/filter.go"
          cp reports/electroneum/C/reports/fixtures/reverse_e_log_range_test.go "$REVERSE_R_SCRATCH/eth/filters/worker_r_reverse_log_range_test.go"
          sha256sum "$WINDEEP_ETN_SOURCE/eth/filters/filter.go" > "$RUNNER_TEMP/reverse-r-log-immutable.sha256"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=12m -run TestReverseELogRangeDefenseMatrix -v ./eth/filters
          echo REVERSE_R_E_LOG_DEFENSE_MATRIX_PASS
      - name: Reverse log oracle - ensure incomplete range is not silently successful
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run TestReverseELogFailClosedOracle -v ./eth/filters > "$RUNNER_TEMP/reverse-r-log-original.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reverse-r-log-original.log"
          if [ "$rc" -eq 0 ]; then echo REVERSE_R_LOG_ORACLE_UNEXPECTED_PASS; exit 65; fi
          grep -Fq 'REVERSE_E_LOG_FAIL_CLOSED_ORACLE_MISMATCH' "$RUNNER_TEMP/reverse-r-log-original.log" || { echo REVERSE_R_LOG_ORACLE_INVALID_FAILURE; exit 66; }
          echo "REVERSE_R_LOG_FAIL_CLOSED_ORACLE_REJECTED exit=$rc"
      - name: Scratch-only log-gap guard proves sensitivity with certified source intact
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/C/reports/fixtures/reverse_e_log_guard_patch.py "$REVERSE_R_SCRATCH/eth/filters/filter.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestReverseELog' -v ./eth/filters
          cd "$GITHUB_WORKSPACE"
          sha256sum --check "$RUNNER_TEMP/reverse-r-log-immutable.sha256"
          echo REVERSE_R_E_LOG_GUARD_SENSITIVITY_AND_SOURCE_INTACT_PASS

      - name: Reverse rawdb canonicality defense matrix before a synthetic reorg race
        shell: bash
        run: |
          set -euo pipefail
          cp reports/electroneum/C/reverse/reverse_e_rawdb_reorg_test.go "$REVERSE_R_SCRATCH/internal/ethapi/worker_r_canonical_reorg_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestReverseECanonicalRawdbDefenseMatrix$' -v ./internal/ethapi
          echo REVERSE_R_E_CANONICAL_RAWDB_DEFENSE_MATRIX_PASS
      - name: Reverse strict canonicality oracle rejects stale receipt success in source
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run '^TestReverseECanonicalTOCTOUOracle$' -v ./internal/ethapi > "$RUNNER_TEMP/reverse-r-canonical-original.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reverse-r-canonical-original.log"
          if [ "$rc" -eq 0 ]; then echo REVERSE_R_CANONICAL_ORACLE_UNEXPECTED_PASS; exit 65; fi
          grep -Fq 'REVERSE_E_CANONICAL_TOCTOU_ORACLE_MISMATCH' "$RUNNER_TEMP/reverse-r-canonical-original.log" || { echo REVERSE_R_CANONICAL_ORACLE_INVALID_FAILURE; exit 66; }
          echo "REVERSE_R_CANONICAL_ORACLE_REJECTED_ORIGINAL exit=$rc"
      - name: Scratch-only post-read canonicality defense proves sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/C/reverse/reverse_e_canonical_guard_patch.py "$REVERSE_R_SCRATCH/internal/ethapi/api.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestReverseECanonical' -v ./internal/ethapi
          cd "$GITHUB_WORKSPACE"
          sha256sum --check "$RUNNER_TEMP/reverse-r-immutable.sha256"
          echo REVERSE_R_CANONICAL_GUARD_SENSITIVITY_CERTIFIED_SOURCE_INTACT_PASS

      - name: Reverse RPC fee width characterizer for signed synthetic transactions
        shell: bash
        run: |
          set -euo pipefail
          cp reports/electroneum/C/reverse/reverse_e_fee_width_test.go "$REVERSE_R_SCRATCH/internal/ethapi/worker_r_fee_width_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseEReceiptFeeWidthCharacterization$' -v ./internal/ethapi
          echo REVERSE_R_E_FEE_WIDTH_CHARACTERIZATION_PASS
      - name: Reverse strict large-fee precision oracle rejects uint64 narrowing
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run '^TestReverseEReceiptFeeWidthOracle$' -v ./internal/ethapi > "$RUNNER_TEMP/reverse-r-fee-original.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reverse-r-fee-original.log"
          if [ "$rc" -eq 0 ]; then echo REVERSE_R_E_FEE_ORACLE_UNEXPECTED_PASS; exit 65; fi
          grep -Fq 'REVERSE_E_FEE_FULLWIDTH_ORACLE_MISMATCH' "$RUNNER_TEMP/reverse-r-fee-original.log" || { echo REVERSE_R_E_FEE_ORACLE_INVALID_FAILURE; exit 66; }
          sha256sum --check "$RUNNER_TEMP/reverse-r-immutable.sha256"
          echo "REVERSE_R_E_FEE_ORACLE_REJECTED_ORIGINAL exit=$rc"

      - name: Reverse downloader peer revocation and receipt retry state machine
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/eth/downloader"
          cp reports/electroneum/C/reverse/reverse_d_receipt_peer_revoke_test.go "$REVERSE_R_SCRATCH/eth/downloader/worker_r_reverse_receipt_peer_revoke_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=15m -run '^TestReverseDReceiptPeerRevocationAndReplay$' -v ./eth/downloader
          echo REVERSE_R_D_RECEIPT_PEER_REVOCATION_MATRIX_PASS
