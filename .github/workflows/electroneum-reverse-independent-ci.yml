name: Electroneum Reverse Independent Audit R
# live-trigger-c001: execute C-001 after prior R regression completed
on:
  push:
    branches: [electroneum-sc-master-audit]
    paths:
      - .github/workflows/electroneum-reverse-independent-ci.yml
      - 'reports/electroneum/C/reverse/**'
      - 'reports/electroneum/C/reports/fixtures/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etn-reverse-independent-audit
  cancel-in-progress: false
jobs:
  reverse-e-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout audit branch at current HEAD
        uses: actions/checkout@v4
        with:
          ref: electroneum-sc-master-audit
          fetch-depth: 0
          persist-credentials: false
      - name: Validate certified immutable Electroneum source
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = '7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0'
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = 'de7f3c75a2db7e87a89918f1257820703d5b731e'
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = '3aeb14db0d6384243302f3a025bdff904dc28bf6'
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = '3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b'
          test -n "$WINDEEP_ETN_SOURCE"
          echo "WINDEEP_ETN_SOURCE=$WINDEEP_ETN_SOURCE" >> "$GITHUB_ENV"
          printf 'REVERSE_R_CERTIFIED_SOURCE_PASS source=%s\n' "$WINDEEP_ETN_SOURCE"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Copy immutable source to isolated R-only scratch and install E challenge
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/worker-r-scratch"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/internal/ethapi" "$scratch/internal/ethapi/api.go"
          cp reports/electroneum/C/reverse/reverse_e_rpc_header_test.go "$scratch/internal/ethapi/worker_r_reverse_e_test.go"
          test -f "$scratch/go.mod"
          echo "REVERSE_R_SCRATCH=$scratch" >> "$GITHUB_ENV"
          sha256sum "$WINDEEP_ETN_SOURCE/internal/ethapi/api.go" > "$RUNNER_TEMP/reverse-r-immutable.sha256"
          echo REVERSE_R_SCRATCH_PREPARED
      - name: Reverse pass - test production adapter defenses before its error path
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseEReceiptDefenseMatrix$' -v ./internal/ethapi
          echo REVERSE_R_E_VALID_NEGATIVE_AND_ADVERSARIAL_CONTROLS_PASS
      - name: Reverse oracle - demonstrate source violation rather than accidentally passing
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run '^TestReverseEFailClosedOracle$' -v ./internal/ethapi > "$RUNNER_TEMP/reverse-r-original.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reverse-r-original.log"
          if [ "$rc" -eq 0 ]; then echo 'REVERSE_R_EXPECTED_MISMATCH_NOT_DETECTED'; exit 65; fi
          grep -Fq 'REVERSE_E_FAIL_CLOSED_ORACLE_MISMATCH' "$RUNNER_TEMP/reverse-r-original.log" || { echo 'REVERSE_R_INVALID_NONSECURITY_FAILURE'; exit 66; }
          echo "REVERSE_R_ORIGINAL_SOURCE_ORACLE_REJECTED exit=$rc"
      - name: Scratch-only defensive guard sensitivity and restoration of source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/C/reverse/reverse_e_guard_patch.py "$REVERSE_R_SCRATCH/internal/ethapi/api.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseE' -v ./internal/ethapi
          cd "$GITHUB_WORKSPACE"
          sha256sum --check "$RUNNER_TEMP/reverse-r-immutable.sha256"
          echo REVERSE_R_E_GUARD_SENSITIVITY_AND_CERTIFIED_SOURCE_INTACT_PASS
      - name: Reverse second-last E item - exercise missing log header partial-response controls
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/eth/filters" "$REVERSE_R_SCRATCH/eth/filters/filter.go"
          cp reports/electroneum/C/reports/fixtures/reverse_e_log_range_test.go "$REVERSE_R_SCRATCH/eth/filters/worker_r_reverse_log_range_test.go"
          sha256sum "$WINDEEP_ETN_SOURCE/eth/filters/filter.go" > "$RUNNER_TEMP/reverse-r-log-immutable.sha256"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=12m -run TestReverseELogRangeDefenseMatrix -v ./eth/filters
          echo REVERSE_R_E_LOG_DEFENSE_MATRIX_PASS
      - name: Reverse log oracle - ensure incomplete range is not silently successful
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run TestReverseELogFailClosedOracle -v ./eth/filters > "$RUNNER_TEMP/reverse-r-log-original.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reverse-r-log-original.log"
          if [ "$rc" -eq 0 ]; then echo REVERSE_R_LOG_ORACLE_UNEXPECTED_PASS; exit 65; fi
          grep -Fq 'REVERSE_E_LOG_FAIL_CLOSED_ORACLE_MISMATCH' "$RUNNER_TEMP/reverse-r-log-original.log" || { echo REVERSE_R_LOG_ORACLE_INVALID_FAILURE; exit 66; }
          echo "REVERSE_R_LOG_FAIL_CLOSED_ORACLE_REJECTED exit=$rc"
      - name: Scratch-only log-gap guard proves sensitivity with certified source intact
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/C/reports/fixtures/reverse_e_log_guard_patch.py "$REVERSE_R_SCRATCH/eth/filters/filter.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestReverseELog' -v ./eth/filters
          cd "$GITHUB_WORKSPACE"
          sha256sum --check "$RUNNER_TEMP/reverse-r-log-immutable.sha256"
          echo REVERSE_R_E_LOG_GUARD_SENSITIVITY_AND_SOURCE_INTACT_PASS

      - name: Reverse rawdb canonicality defense matrix before a synthetic reorg race
        shell: bash
        run: |
          set -euo pipefail
          cp reports/electroneum/C/reverse/reverse_e_rawdb_reorg_test.go "$REVERSE_R_SCRATCH/internal/ethapi/worker_r_canonical_reorg_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestReverseECanonicalRawdbDefenseMatrix$' -v ./internal/ethapi
          echo REVERSE_R_E_CANONICAL_RAWDB_DEFENSE_MATRIX_PASS
      - name: Reverse strict canonicality oracle rejects stale receipt success in source
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run '^TestReverseECanonicalTOCTOUOracle$' -v ./internal/ethapi > "$RUNNER_TEMP/reverse-r-canonical-original.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reverse-r-canonical-original.log"
          if [ "$rc" -eq 0 ]; then echo REVERSE_R_CANONICAL_ORACLE_UNEXPECTED_PASS; exit 65; fi
          grep -Fq 'REVERSE_E_CANONICAL_TOCTOU_ORACLE_MISMATCH' "$RUNNER_TEMP/reverse-r-canonical-original.log" || { echo REVERSE_R_CANONICAL_ORACLE_INVALID_FAILURE; exit 66; }
          echo "REVERSE_R_CANONICAL_ORACLE_REJECTED_ORIGINAL exit=$rc"
      - name: Scratch-only post-read canonicality defense proves sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/C/reverse/reverse_e_canonical_guard_patch.py "$REVERSE_R_SCRATCH/internal/ethapi/api.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestReverseECanonical' -v ./internal/ethapi
          cd "$GITHUB_WORKSPACE"
          sha256sum --check "$RUNNER_TEMP/reverse-r-immutable.sha256"
          echo REVERSE_R_CANONICAL_GUARD_SENSITIVITY_CERTIFIED_SOURCE_INTACT_PASS

      - name: Reverse RPC fee width characterizer for signed synthetic transactions
        shell: bash
        run: |
          set -euo pipefail
          cp reports/electroneum/C/reverse/reverse_e_fee_width_test.go "$REVERSE_R_SCRATCH/internal/ethapi/worker_r_fee_width_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseEReceiptFeeWidthCharacterization$' -v ./internal/ethapi
          echo REVERSE_R_E_FEE_WIDTH_CHARACTERIZATION_PASS
      - name: Reverse strict large-fee precision oracle rejects uint64 narrowing
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run '^TestReverseEReceiptFeeWidthOracle$' -v ./internal/ethapi > "$RUNNER_TEMP/reverse-r-fee-original.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reverse-r-fee-original.log"
          if [ "$rc" -eq 0 ]; then echo REVERSE_R_E_FEE_ORACLE_UNEXPECTED_PASS; exit 65; fi
          grep -Fq 'REVERSE_E_FEE_FULLWIDTH_ORACLE_MISMATCH' "$RUNNER_TEMP/reverse-r-fee-original.log" || { echo REVERSE_R_E_FEE_ORACLE_INVALID_FAILURE; exit 66; }
          sha256sum --check "$RUNNER_TEMP/reverse-r-immutable.sha256"
          echo "REVERSE_R_E_FEE_ORACLE_REJECTED_ORIGINAL exit=$rc"

      - name: Reverse downloader peer revocation and receipt retry state machine
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/eth/downloader"
          cp reports/electroneum/C/reverse/reverse_d_receipt_peer_revoke_test.go "$REVERSE_R_SCRATCH/eth/downloader/worker_r_reverse_receipt_peer_revoke_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=15m -run '^TestReverseDReceiptPeerRevocationAndReplay$' -v ./eth/downloader
          echo REVERSE_R_D_RECEIPT_PEER_REVOCATION_MATRIX_PASS
      - name: Reverse downloader cancelled-session reset and timeout recovery
        shell: bash
        run: |
          set -euo pipefail
          cp reports/electroneum/C/reports/fixtures/reverse_d_restart_expire_test.go "$REVERSE_R_SCRATCH/eth/downloader/worker_r_restart_expire_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=15m -run '^TestReverseDReceiptRestartAndExpiry$' -v ./eth/downloader
          echo REVERSE_R_D_RESTART_EXPIRY_REGRESSION_PASS

      - name: Reverse local header rollback and restart integrity
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/core"
          cp reports/electroneum/C/reports/fixtures/reverse_d_header_restart_test.go "$REVERSE_R_SCRATCH/core/worker_r_reverse_d_header_restart_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=15m -run '^TestReverseDHeaderRollbackRestart$' -v ./core
          echo REVERSE_R_D_RESTART_CANONICALITY_MATRIX_PASS
      - name: Reverse deeper rewind reimport and corrupted-root re-admission
        shell: bash
        run: |
          set -euo pipefail
          cp reports/electroneum/C/reports/fixtures/reverse_d_header_rewind_restart_test.go "$REVERSE_R_SCRATCH/core/worker_r_reverse_d_header_rewind_reimport_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=15m -run '^TestReverseDHeaderSetHeadRestart$' -v ./core
          echo REVERSE_R_D_SETHEAD_REIMPORT_AND_BAD_ROOT_PASS
      - name: Reverse independent eth66 raw receipt commitments and semantic decoding
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/eth/protocols/eth"
          cp reports/electroneum/C/reports/fixtures/reverse_d_receipt_wire_root_test.go "$REVERSE_R_SCRATCH/eth/protocols/eth/worker_r_receipt_wire_root_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestReverseDReceiptWireCommitmentDifferential$' -v ./eth/protocols/eth
          echo REVERSE_R_D_RECEIPT_WIRE_CANONICALITY_PASS
      - name: Reverse exported malformed keystore import actual boundary
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/accounts/keystore" "$REVERSE_R_SCRATCH/accounts/keystore/passphrase.go"
          cp reports/electroneum/C/reports/fixtures/reverse_c_import_boundary_test.go "$REVERSE_R_SCRATCH/accounts/keystore/worker_r_import_boundary_test.go"
          sha256sum "$WINDEEP_ETN_SOURCE/accounts/keystore/passphrase.go" > "$RUNNER_TEMP/reverse-r-keystore-immutable.sha256"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseCExportedKeyStoreImportMatrix$' -v ./accounts/keystore
          echo REVERSE_R_C_KEYSTORE_IMPORT_CHARACTERIZATION_PASS
      - name: Reverse strict keystore import malformed-salt oracle rejects original
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run '^TestReverseCExportedImportFailClosedOracle$' -v ./accounts/keystore > "$RUNNER_TEMP/reverse-r-import-original.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reverse-r-import-original.log"
          if [ "$rc" -eq 0 ]; then echo REVERSE_R_C_IMPORT_ORACLE_UNEXPECTED_PASS; exit 65; fi
          grep -Fq 'REVERSE_C_EXPORT_IMPORT_FAIL_CLOSED_ORACLE_MISMATCH' "$RUNNER_TEMP/reverse-r-import-original.log" || { echo REVERSE_R_C_IMPORT_ORACLE_NONSECURITY_FAILURE; exit 66; }
          echo "REVERSE_R_C_EXPORT_IMPORT_ORIGINAL_REJECTED exit=$rc"
      - name: Reverse unrecovered exported keystore import process propagation
        shell: bash
        run: |
          set -euo pipefail
          cd "$REVERSE_R_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run TestReverseCExportedImportUnrecoveredPanic -v ./accounts/keystore > "$RUNNER_TEMP/reverse-r-import-unrecovered.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/reverse-r-import-unrecovered.log"
          if [ "$rc" -eq 0 ]; then echo REVERSE_R_C_UNRECOVERED_IMPORT_UNEXPECTED_PASS; exit 65; fi
          grep -Fq "REVERSE_C_UNRECOVERED_IMPORT_BEGIN" "$RUNNER_TEMP/reverse-r-import-unrecovered.log" || { echo REVERSE_R_C_UNRECOVERED_IMPORT_MISSING_BEGIN; exit 66; }
          grep -Fq "interface conversion: interface {} is nil, not string" "$RUNNER_TEMP/reverse-r-import-unrecovered.log" || { echo REVERSE_R_C_UNRECOVERED_IMPORT_WRONG_FAILURE; exit 67; }
          grep -Fq "KeyStore).Import" "$RUNNER_TEMP/reverse-r-import-unrecovered.log" || { echo REVERSE_R_C_UNRECOVERED_IMPORT_STACK_MISSING; exit 68; }
          echo "REVERSE_R_C_UNRECOVERED_IMPORT_PROCESS_FAILURE_CONFIRMED exit=$rc"

      - name: Reverse scratch-only keystore salt guard sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/C/reports/fixtures/reverse_c_import_salt_guard.py "$REVERSE_R_SCRATCH/accounts/keystore/passphrase.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseCExportedImportFailClosedOracle$' -v ./accounts/keystore
          cd "$GITHUB_WORKSPACE"
          sha256sum --check "$RUNNER_TEMP/reverse-r-keystore-immutable.sha256"
          echo REVERSE_R_C_KEYSTORE_GUARD_SENSITIVITY_PASS

      - name: Reverse C-001 personal wallet initialization exposure controls
        shell: bash
        run: |
          set -euo pipefail
          cp reports/electroneum/C/reports/fixtures/reverse_c_personal_rpc_test.go "$REVERSE_R_SCRATCH/internal/ethapi/worker_r_personal_init_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=12m -run '^(TestReverseCInitializeWalletDefenseMatrix|TestReverseCPersonalAPIRegistrationIsPrivate)$' -v ./internal/ethapi
          echo REVERSE_R_C_PERSONAL_INITIALIZE_DEFENSE_MATRIX_PASS

      - name: Reverse C-001 RPC error result suppression control
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/rpc"
          cp reports/electroneum/C/reports/fixtures/reverse_c_rpc_error_result_test.go "$REVERSE_R_SCRATCH/rpc/worker_r_rpc_error_result_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseCRPCErrorSuppressesSensitiveResult$' -v ./rpc
          echo REVERSE_R_C_RPC_ERROR_RESULT_SUPPRESSION_PASS

      - name: Reverse C-001 real RPC handler mnemonic-shaped error confidentiality
        shell: bash
        run: |
          set -euo pipefail
          cp reports/electroneum/C/reports/fixtures/reverse_c_mnemonic_rpc_test.go "$REVERSE_R_SCRATCH/rpc/worker_r_mnemonic_rpc_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseCMnemonicRPCErrorAndRecovery$' -v ./rpc
          echo REVERSE_R_C_MNEMONIC_RPC_CONFIDENTIALITY_PASS

      - name: Reverse C-001 default HTTP and WS module exposure
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/node"
          cp reports/electroneum/C/reports/fixtures/reverse_c_default_modules_test.go "$REVERSE_R_SCRATCH/node/worker_r_default_modules_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestReverseCDefaultTransportExcludesPersonal$' -v ./node
          echo REVERSE_R_C_DEFAULT_PERSONAL_EXPOSURE_PASS

      - name: Reverse B round-width defects versus authenticated admission
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/consensus/istanbul/core"
          cp reports/electroneum/C/reports/fixtures/reverse_b_round_reachability_test.go "$REVERSE_R_SCRATCH/consensus/istanbul/core/worker_r_round_reachability_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=15m -run '^(TestReverseBRoundAliasReachability|TestReverseBRound63ReconstructionReachability|TestReverseB32AdmissionBarrier)$' -v ./consensus/istanbul/core
          echo REVERSE_R_B_ROUND_REACHABILITY_MATRIX_PASS

      - name: Reverse B 2^32 committed-seal signing domain
        shell: bash
        run: |
          set -euo pipefail
          chmod u+w "$REVERSE_R_SCRATCH/consensus/istanbul/engine"
          cp reports/electroneum/C/reports/fixtures/reverse_b_round32_seal_test.go "$REVERSE_R_SCRATCH/consensus/istanbul/engine/worker_r_round32_seal_test.go"
          cd "$REVERSE_R_SCRATCH"
          go test -count=1 -timeout=15m -run '^TestReverseB32CommittedSealDomain$' -v ./consensus/istanbul/engine
          echo REVERSE_R_B32_SIGNING_DOMAIN_MATRIX_PASS
