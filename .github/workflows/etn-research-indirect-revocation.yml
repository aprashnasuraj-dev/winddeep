name: ETN isolated novel boundary reproduction
on:
  push:
    branches:
      - research/etn-indirect-priority-revocation-20261111
    paths:
      - reports/electroneum/C/research_indirect_revocation_test.go
      - .github/workflows/etn-research-indirect-revocation.yml
permissions:
  contents: read
jobs:
  signed-indirect-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize pinned immutable target
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          echo "PINNED_TARGET_READY=$WINDEEP_ETN_PINNED_SOURCE_COMMIT"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Run real target with signed transactions and negative controls
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$WINDEEP_ETN_SOURCE" "$RUNNER_TEMP/etn-scratch"
          chmod -R u+w "$RUNNER_TEMP/etn-scratch"
          cp "$GITHUB_WORKSPACE/reports/electroneum/C/research_indirect_revocation_test.go" "$RUNNER_TEMP/etn-scratch/core/research_indirect_revocation_test.go"
          cd "$RUNNER_TEMP/etn-scratch"
          go test -count=3 -timeout=10m -run '^TestResearchIndirect(RevocationBypass|StateProcessor) -v ./core 2>&1 | tee "$RUNNER_TEMP/etn-new-poc.log"
          sha256sum "$RUNNER_TEMP/etn-new-poc.log" | tee "$RUNNER_TEMP/etn-new-poc.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etn-novel-indirect-revocation
          path: |
            ${{ runner.temp }}/etn-new-poc.log
            ${{ runner.temp }}/etn-new-poc.sha256
          if-no-files-found: warn
          retention-days: 14
 -v ./core 2>&1 | tee "$RUNNER_TEMP/etn-new-poc.log"
          sha256sum "$RUNNER_TEMP/etn-new-poc.log" | tee "$RUNNER_TEMP/etn-new-poc.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etn-novel-indirect-revocation
          path: |
            ${{ runner.temp }}/etn-new-poc.log
            ${{ runner.temp }}/etn-new-poc.sha256
          if-no-files-found: warn
          retention-days: 14
