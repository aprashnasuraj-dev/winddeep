name: Windeep v2 Windows Candidate

on:
  push:
    branches: [v2/product-overhaul]
    paths:
      - 'VERSION'
      - 'Windeep.spec'
      - 'app/**'
      - 'installer/**'
      - 'scripts/package_v2_offline.py'
      - 'scripts/audit/v2_offline_audit.py'
      - 'scripts/audit/windows_install_audit.ps1'
      - 'scripts/audit/release_audit.py'
      - 'tools_config.json'
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-v2-candidate:
    runs-on: windows-latest
    timeout-minutes: 95
    env:
      PYTHONPATH: ${{ github.workspace }}
      WINDEEP_NO_BROWSER: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip

      - name: Verify generated v2 source is committed
        shell: pwsh
        run: |
          python scripts/migrate_v2_overhaul.py
          python scripts/migrate_v2_ui_selection.py
          git diff --exit-code -- app/engine/tool_wrapper.py app/server.py app/static/app.js app/tools/config
          if ($LASTEXITCODE -ne 0) { throw 'v2 generated runtime differs from committed source' }

      - name: Install requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Phase A static catalog audit
        run: python scripts/audit/release_audit.py --phase A

      - name: Phase B packaging contract audit
        run: python scripts/audit/release_audit.py --phase B

      - name: Phase E dependency audit
        run: python scripts/audit/release_audit.py --phase E

      - name: Test v2 product and coverage
        run: python -m pytest -q --cov=app --cov=launcher --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=85

      - name: Phase D local end-to-end audit
        run: python scripts/audit/release_audit.py --phase D

      - name: Phase F pre-tag gate
        shell: pwsh
        run: |
          Remove-Item Env:GITHUB_REF_NAME -ErrorAction SilentlyContinue
          python scripts/audit/release_audit.py --phase F

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Stage pinned Windows payloads
        shell: pwsh
        run: ./installer/setup_tools.ps1

      - name: Verify staged tool payloads
        run: python scripts/audit/release_audit.py --phase B --require-installed

      - name: Bundle embedded Python and Playwright Chromium
        shell: pwsh
        run: ./installer/install_python.ps1

      - name: Verify embedded runtime
        shell: pwsh
        run: |
          if (-not (Test-Path 'runtime/python/python.exe')) { throw 'embedded python.exe missing' }
          $py = & 'runtime/python/python.exe' --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $py -notmatch '^Python 3\.11\.') { throw "embedded Python mismatch: $py" }
          $browserFiles = @(Get-ChildItem 'runtime/playwright-browsers' -Recurse -File -ErrorAction SilentlyContinue)
          if ($browserFiles.Count -eq 0) { throw 'embedded Playwright browser payload missing' }

      - name: Build portable Windows application
        run: pyinstaller --clean --noconfirm Windeep.spec

      - name: Verify packaged v2 catalog and UI
        shell: pwsh
        run: |
          $required = @(
            'dist/Windeep/Windeep.exe',
            'dist/Windeep/VERSION',
            'dist/Windeep/tools_config.json',
            'dist/Windeep/app/static/index.html',
            'dist/Windeep/app/static/app.js',
            'dist/Windeep/app/tools/config/recon_passive.json',
            'dist/Windeep/app/tools/config/recon_active.json',
            'dist/Windeep/app/tools/config/web_vulns.json',
            'dist/Windeep/app/tools/config/mobile.json',
            'dist/Windeep/app/tools/config/web3.json',
            'dist/Windeep/app/tools/config/secrets.json',
            'dist/Windeep/app/tools/config/network.json',
            'dist/Windeep/app/tools/config/utilities.json'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "packaged v2 file missing: $path" } }
          $registry = Get-Content 'dist/Windeep/tools_config.json' -Raw | ConvertFrom-Json
          if ($registry.tool_count -ne 137 -or $registry.active_tool_count -ne 137) { throw 'packaged registry is not 137/137 active' }

      - name: Build Windows setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc 'installer\BugBountyInstaller.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/Windeep-Setup.exe')) { throw 'Windeep-Setup.exe was not produced' }

      - name: Clean Windows install and portable audit
        shell: pwsh
        run: ./scripts/audit/windows_install_audit.ps1

      - name: Build v2 offline kit
        run: python scripts/package_v2_offline.py

      - name: Audit v2 offline kit
        run: python scripts/audit/v2_offline_audit.py dist/Windeep-v2-Offline-Kit.zip

      - name: Generate candidate checksums
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = (Get-FileHash 'dist/Windeep-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $kit = (Get-FileHash 'dist/Windeep-v2-Offline-Kit.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$setup  Windeep-Setup.exe",
            "$kit  Windeep-v2-Offline-Kit.zip"
          ) | Set-Content 'dist/SHA256SUMS.txt' -Encoding ascii
          @{
            version = $version
            commit = '${{ github.sha }}'
            integration_count = 137
            setup_sha256 = $setup
            offline_kit_sha256 = $kit
          } | ConvertTo-Json | Set-Content 'reports/v2-candidate.json' -Encoding utf8
          Get-Content 'dist/SHA256SUMS.txt'

      - name: Upload v2 Windows candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windeep-v2-windows-candidate-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/Windeep-Setup.exe
            dist/Windeep-v2-Offline-Kit.zip
            dist/SHA256SUMS.txt
            reports/*.md
            reports/*.json
            reports/coverage.xml
