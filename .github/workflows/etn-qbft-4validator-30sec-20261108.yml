name: ETN 30-second full ETH66 to genuine 4-validator QBFT outage
on:
  push:
    branches: [etn-qbft-4validator-liveness-20261108]
    paths: [.github/workflows/etn-qbft-4validator-30sec-20261108.yml]
permissions:
  contents: read
jobs:
  bounded-30second:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: electroneum/electroneum-sc
          ref: db0eb8792dd57304fbc66a60377c7663e1bd44d2
          path: etn-target
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Verify current upstream, stage experimental test and hash source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C etn-target rev-parse HEAD)" = db0eb8792dd57304fbc66a60377c7663e1bd44d2
          mkdir -p evidence/PoC
          cp reports/electroneum/B/tests/independent_eth66_wire_to_four_qbft_test.go etn-target/eth/adversarial_eth66_four_qbft_test.go
          gofmt -w etn-target/eth/adversarial_eth66_four_qbft_test.go
          cp etn-target/eth/adversarial_eth66_four_qbft_test.go evidence/PoC/
          printf "official_upstream=db0eb8792dd57304fbc66a60377c7663e1bd44d2\\ncase=one_ETH66_peer_3_signers_vs_two_ETH66_peers_2_signers\\nreproduction_sha=${{ github.sha }}\\noffline_only=true\\n" > evidence/identity.txt
      - name: Three fresh network states and >=30 seconds without finalization
        shell: bash
        working-directory: etn-target
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            go test ./eth -run '^TestIndependentTwoEth66WirePeersHaltFourQBFTSignerQuorum$' -count=1 -v -timeout=140s 2>&1 | tee "../evidence/finality30-$n.log"
          done
          (cd ../evidence && sha256sum finality30-*.log PoC/*.go identity.txt > MANIFEST.sha256)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etn-qbft-30second-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
