name: ETN 9-validator all-miners automatic peer finality differential
on:
  push:
    branches: [etn-qbft-nine-fullminers-20261108]
    paths: [.github/workflows/etn-qbft-nine-all-miners-20261108.yml]
permissions:
  contents: read
jobs:
  authenticated-nine-miner-quorum:
    strategy:
      fail-fast: false
      matrix:
        case: [control-three, attack-four]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: electroneum/electroneum-sc
          ref: db0eb8792dd57304fbc66a60377c7663e1bd44d2
          path: target
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Stage source and record pins
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = db0eb8792dd57304fbc66a60377c7663e1bd44d2
          mkdir -p evidence/PoC
          cp reports/electroneum/B/tests/independent_eth66_wire_to_nine_full_miners_test.go target/eth/adversarial_eth66_nine_full_miners_test.go
          (cd target && gofmt -w eth/adversarial_eth66_nine_full_miners_test.go)
          cp target/eth/adversarial_eth66_nine_full_miners_test.go evidence/PoC/
          echo 'upstream=db0eb8792dd57304fbc66a60377c7663e1bd44d2' > evidence/identity.txt
          echo 'test_version=${{ github.sha }}' >> evidence/identity.txt
          echo 'nine_real_miners=true, automatic_eth66=true, no_public_network=true' >> evidence/identity.txt
      - name: Independently repeat signed healthy baseline and attack versus control
        working-directory: target
        run: |
          set -euo pipefail
          if [ "${{ matrix.case }}" = "control-three" ]; then
            rex='^TestIndependentNineFullMinersThreePeerGuard$'
          else
            rex='^TestIndependentNineFullMinersFourPeerLiveness$'
          fi
          for n in 1 2 3; do
            go test ./eth -run "$rex" -count=1 -v -timeout=125s 2>&1 | tee "../evidence/${{ matrix.case }}-$n.log"
          done
          (cd ../evidence && sha256sum *.log PoC/*.go identity.txt > MANIFEST.sha256)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etn-full-nine-${{ matrix.case }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
