name: ETN independent bounded FeeHistory evidence
on:
  push:
    branches: [etn-independent-proof-20261106]
    paths:
      - .github/workflows/etn-independent-proof.yml
      - reports/electroneum/E/test_independent_feehistory_amplification_test.go
permissions:
  contents: read
  statuses: write
concurrency:
  group: etn-independent-feehistory
  cancel-in-progress: false
jobs:
  certified-feehistory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout independent evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish evidence run URL
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=etn-proof/feehistory -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Certified bounded regression running"
      - name: Bootstrap immutable certified source
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = "7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = "de7f3c75a2db7e87a89918f1257820703d5b731e"
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = "3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b"
          echo "WINDEEP_ETN_SOURCE=$WINDEEP_ETN_SOURCE" >> "$GITHUB_ENV"
          echo "ETN_INDEPENDENT_CERTIFIED_SOURCE_PASS"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Prepare isolated non-production source copy
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/etn-independent-source"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/eth/gasprice"
          cp "$GITHUB_WORKSPACE/reports/electroneum/E/test_independent_feehistory_amplification_test.go" "$scratch/eth/gasprice/etn_independent_feehistory_test.go"
          echo "ETN_PROOF_SCRATCH=$scratch" >> "$GITHUB_ENV"
          echo "ETN_INDEPENDENT_SCRATCH_READY"
      - name: Reproduce FeeHistory amplification on certified real Go implementation
        shell: bash
        run: |
          set -euo pipefail
          cd "$ETN_PROOF_SCRATCH"
          go test -count=1 -timeout=9m -run '^TestIndependentFeeHistoryRewardPercentileAmplification$' -v ./eth/gasprice 2>&1 | tee "$RUNNER_TEMP/etn-feehistory-proof.log"
          grep -q 'ETN_PROVEN_FEEHISTORY_AMPLIFICATION percentiles=4096 blocks=32 matrix_cells=131072' "$RUNNER_TEMP/etn-feehistory-proof.log"
          echo ETN_INDEPENDENT_FEEHISTORY_TARGET_PROOF_PASS
      - name: Store non-sensitive proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etn-independent-feehistory-proof
          path: ${{ runner.temp }}/etn-feehistory-proof.log
          if-no-files-found: ignore
      - name: Publish final status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          result=success
          [ "$RESULT" = success ] || result=failure
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$result" -f context=etn-proof/feehistory -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description="Certified bounded proof: $RESULT"
