name: Electroneum HTTP Batch Filter Bounded Audit
on:
  push:
    branches: [electroneum-sc-master-audit]
    paths:
      - '.github/workflows/electroneum-http-batch-filter-audit.yml'
      - 'reports/electroneum/E/batch_filter_amplification_test.go'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etn-http-batch-filter-audit
  cancel-in-progress: false
jobs:
  bounded-real-http-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Certified immutable upstream source
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = "de7f3c75a2db7e87a89918f1257820703d5b731e"
          echo "WINDEEP_ETN_SOURCE=$WINDEEP_ETN_SOURCE" >> "$GITHUB_ENV"
          echo ETN_HTTP_BATCH_PINNED_SOURCE_PASS
      - name: Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Run actual RPC and filter manager without network exposure
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/etn-http-batch-filter-scratch"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/eth/filters"
          cp reports/electroneum/E/batch_filter_amplification_test.go "$scratch/eth/filters/batch_filter_amplification_test.go"
          cd "$scratch"
          go test -count=3 -timeout=12m -run '^TestBatchFilterAmplificationHTTPRealTarget$' -v ./eth/filters
          echo ETN_HTTP_FILTER_ACTUAL_TARGET_THREE_REPEATS_PASS
