name: Verify Electroneum audit target

on:
  push:
    branches:
      - electroneum-sc-master-audit
    paths:
      - tools/electroneum_target_bootstrap.sh
      - .github/workflows/unzip-electroneum.yml
  workflow_dispatch:

jobs:
  target-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap and verify pinned target
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = "3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b"
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          test -f "$WINDEEP_ETN_SOURCE/go.mod"
          echo "Canonical source: $WINDEEP_ETN_SOURCE"
