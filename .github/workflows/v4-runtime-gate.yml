name: Windeep v4 Runtime Gate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'docker/**'
      - 'tests/test_v4_runtime.py'
      - 'tools_config.json'
      - 'requirements*.txt'
      - '.github/workflows/v4-runtime-gate.yml'
  push:
    branches: [main, v4.0-dev]
    tags: ['v4.*']

permissions:
  contents: read

jobs:
  contract:
    name: Contract ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile v4 runtime
        run: python -m compileall -q app launcher.py
      - name: Enforce catalog route and resolver contracts
        run: python -m pytest -q tests/test_v4_runtime.py
      - name: Show host backend capabilities
        run: python launcher.py doctor --backends --json

  container:
    name: Container backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build versioned Windeep tools image
        run: docker build -f docker/tools.Dockerfile -t winddeep/tools:v3 .
      - name: Probe heavy and mobile tools in image
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            shift
            set +e
            local output
            output="$(timeout 45s docker run --rm winddeep/tools:v3 "$@" 2>&1)"
            local rc=$?
            set -e
            printf '%s\n' "[$label] rc=$rc"
            printf '%s\n' "$output" | head -n 20

            # Liveness means the executable actually started. A number of
            # security CLIs intentionally return 1 or 2 for -h/--version.
            # Reserve timeout/Docker/exec/signal codes as hard failures.
            if [[ $rc -eq 124 || $rc -eq 125 || $rc -eq 126 || $rc -eq 127 || $rc -ge 128 ]]; then
              echo "::error title=Container liveness failure::$label failed to start cleanly (rc=$rc)"
              return 1
            fi
            if [[ -z "$output" ]]; then
              echo "::error title=Container liveness failure::$label produced no liveness output"
              return 1
            fi
          }

          probe nmap nmap --version
          probe masscan masscan --version
          probe tshark tshark --version
          probe nikto nikto -Version
          probe sqlmap sqlmap --version
          probe metasploit msfconsole --version
          probe wpscan wpscan --version
          probe radare2 r2 -v
          probe apktool apktool --version
          probe jadx jadx --version
          probe frida frida --version
          probe objection objection version

  wsl-contract:
    name: Windows WSL backend contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify WSL executable and backend code path
        shell: pwsh
        run: |
          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) { throw 'wsl.exe is unavailable on runner' }
          python -m compileall -q app
          Select-String -Path app/tools/backends.py -Pattern 'class WslBackend' -Quiet | ForEach-Object { if (-not $_) { throw 'WslBackend missing' } }

  full-heal:
    name: Full catalog heal ${{ matrix.os }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v4.0-dev' || startsWith(github.ref, 'refs/tags/v4.')
    needs: [contract, container, wsl-contract]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install runtime, tests and pipx
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt pipx
          python -m pipx ensurepath
      - name: Heal and probe complete catalog
        shell: bash
        if: runner.os != 'Windows'
        run: |
          python launcher.py doctor --heal --yes --json > v4-doctor-${{ runner.os }}.json
          python - <<'PY'
          import json
          data=json.load(open('v4-doctor-${{ runner.os }}.json', encoding='utf-8'))
          if data['unavailable']:
              missing=[row['tool'] for row in data['tools'] if row['tier']=='unavailable']
              raise SystemExit('unavailable tools: '+', '.join(missing))
          failed=[row['tool'] for row in data['tools'] if row['probe'].get('status')=='failed']
          if failed:
              raise SystemExit('probe failures: '+', '.join(failed))
          PY
      - name: Heal and probe complete catalog (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          python launcher.py doctor --heal --yes --json | Out-File -Encoding utf8 v4-doctor-Windows.json
          $data = Get-Content v4-doctor-Windows.json -Raw | ConvertFrom-Json
          if ($data.unavailable -ne 0) { throw "Unavailable tools remain: $($data.unavailable)" }
          $failed = @($data.tools | Where-Object { $_.probe.status -eq 'failed' })
          if ($failed.Count -ne 0) { throw "Probe failures: $($failed.tool -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: v4-doctor-${{ runner.os }}
          path: v4-doctor-*.json
