name: Windeep v4 Runtime Gate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'docker/**'
      - 'scripts/probe_v4_container.py'
      - 'scripts/validate_v4_runtime_matrix.py'
      - 'tests/test_v4_runtime.py'
      - 'tools_config.json'
      - 'requirements*.txt'
      - '.github/workflows/v4-runtime-gate.yml'
  push:
    branches: [main, v4.0-dev]
    tags: ['v4.*']

permissions:
  contents: read

concurrency:
  group: windeep-v4-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile v4 runtime
        run: python -m compileall -q app launcher.py scripts/probe_v4_container.py scripts/validate_v4_runtime_matrix.py
      - name: Enforce catalog route and resolver contracts
        run: python -m pytest -q tests/test_v4_runtime.py
      - name: Show host backend capabilities
        run: python launcher.py doctor --backends --json

  container:
    name: Container backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build versioned Windeep tools image
        run: docker build -f docker/tools.Dockerfile -t winddeep/tools:v3 .
      - name: Probe every declared shared-container route
        run: python scripts/probe_v4_container.py --image winddeep/tools:v3

  wsl-contract:
    name: Windows WSL backend contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify WSL executable and backend code path
        shell: pwsh
        run: |
          if (-not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) { throw 'wsl.exe is unavailable on runner' }
          python -m compileall -q app
          Select-String -Path app/tools/backends.py -Pattern 'class WslBackend' -Quiet | ForEach-Object { if (-not $_) { throw 'WslBackend missing' } }
          Select-String -Path app/tools/wsl_provisioning.py -Pattern 'def provision_wsl' -Quiet | ForEach-Object { if (-not $_) { throw 'WSL provisioning path missing' } }

  full-heal:
    name: Full catalog heal ${{ matrix.os }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v4.0-dev' || startsWith(github.ref, 'refs/tags/v4.')
    needs: [contract, container, wsl-contract]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install runtime, tests and pipx
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt pipx
          python -m pipx ensurepath
      - name: Heal and probe complete catalog
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set +e
          python launcher.py doctor --heal --yes --json > v4-doctor-${{ runner.os }}.json
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 3 ]]; then
            echo "doctor failed unexpectedly with rc=$rc"
            exit "$rc"
          fi
          python - <<'PY'
          import json
          data=json.load(open('v4-doctor-${{ runner.os }}.json', encoding='utf-8'))
          assert data['schema'] == 'windeep.doctor.v4'
          assert data['catalog'] == 137
          print('platform runnable', data['runnable'], 'unavailable', data['unavailable'])
          PY
      - name: Heal and probe complete catalog (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          python launcher.py doctor --heal --yes --json | Out-File -Encoding utf8 v4-doctor-Windows.json
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and $rc -ne 3) { throw "Doctor failed unexpectedly with rc=$rc" }
          $data = Get-Content v4-doctor-Windows.json -Raw | ConvertFrom-Json
          if ($data.schema -ne 'windeep.doctor.v4') { throw "Unexpected doctor schema: $($data.schema)" }
          if ($data.catalog -ne 137) { throw "Unexpected catalog count: $($data.catalog)" }
          Write-Host "platform runnable=$($data.runnable) unavailable=$($data.unavailable)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-doctor-${{ runner.os }}
          path: v4-doctor-*.json
          if-no-files-found: error

  catalog-union:
    name: Catalog runtime union
    needs: [full-heal]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v5
        with:
          pattern: v4-doctor-*
          path: v4-doctor-reports
          merge-multiple: true
      - name: Require every catalog tool to have runtime or explicit host/credential contract
        shell: bash
        run: |
          python scripts/validate_v4_runtime_matrix.py v4-doctor-reports/v4-doctor-*.json --output v4-runtime-matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4-runtime-matrix
          path: v4-runtime-matrix.json
