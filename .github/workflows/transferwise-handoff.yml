name: TransferWise Scheduled Worker Readiness

on:
  push:
    branches: [transferwise]
    paths:
      - 'transferwise/**'
      - 'config/programs/transferwise_github.json'
      - 'scripts/audit/transferwise_handoff.py'
      - 'tests/test_transferwise_handoff.py'
      - '.gitignore'
      - 'scripts/audit/transferwise_workspace.py'
      - 'tests/test_transferwise_workspace.py'
      - 'transferwise/tooling/**'
      - '.devcontainer/**'
      - 'requirements-audit.txt'
      - '.github/workflows/transferwise-handoff.yml'
  pull_request:
    branches: [transferwise]
    paths:
      - 'transferwise/**'
      - 'config/programs/transferwise_github.json'
      - 'scripts/audit/transferwise_handoff.py'
      - 'tests/test_transferwise_handoff.py'
      - '.gitignore'
      - '.github/workflows/transferwise-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transferwise-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify scope, lane ownership, and no tracked private evidence
        run: python scripts/audit/transferwise_handoff.py repo-check
      - name: Preflight executable environment
        run: python scripts/audit/transferwise_workspace.py doctor --check
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test portable evidence integrity and existing Wise scope
        run: python -m pytest -q tests/test_transferwise_handoff.py tests/test_transferwise_audit_scope.py tests/test_transferwise_workspace.py
