name: Promote audited v3.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v3.0.0.yml'

permissions:
  contents: write
  actions: write

jobs:
  promote:
    name: tag-and-dispatch-v3.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag audited merge and dispatch Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: d770a9d780622d5adc6d73c43751e8ec9511aae4
          RELEASE_TAG: v3.0.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          test "$(git show "$TARGET_SHA:VERSION" | tr -d '\r\n')" = "3.0.0"

          remote_sha="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            test "$remote_sha" = "$TARGET_SHA"
          else
            git tag "$RELEASE_TAG" "$TARGET_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          gh workflow run release.yml --ref "$RELEASE_TAG"
          echo "Dispatched release.yml at $RELEASE_TAG -> $TARGET_SHA"
