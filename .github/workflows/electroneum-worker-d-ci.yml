name: Electroneum Worker D certified historical roots
on:
  push:
    branches: [electroneum-sc-master-audit]
    paths:
      - .github/workflows/electroneum-worker-d-ci.yml
      - reports/electroneum/D/test_historical_root_guards.py
      - reports/electroneum/D/test_historical_roots_test.go
      - reports/electroneum/D/test_historical_import_test.go
      - reports/electroneum/D/test_partial_receipt_runtime_test.go
      - reports/electroneum/D/test_rewind_txlookup_test.go
      - tools/electroneum_target_bootstrap.sh
      - reports/electroneum/TARGET_CERTIFICATE.json
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: 'Adversarial full-import fuzz budget (1..300 minutes)'
        type: number
        required: false
        default: 15
permissions:
  contents: read
  statuses: write
concurrency:
  group: etn-worker-d-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker-d-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: electroneum-sc-master-audit
          fetch-depth: 0
          persist-credentials: false
      - name: Publish class D CI run ID
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/electroneum_ci_status.sh D start
      - name: Bootstrap certified Git source
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = "7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = "de7f3c75a2db7e87a89918f1257820703d5b731e"
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = "3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b"
          echo "WORKER_D_CERTIFIED_BOOTSTRAP_PASS source=$WINDEEP_ETN_SOURCE"
      - name: Execute certified source-contract negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/D/test_historical_root_guards.py "$WINDEEP_ETN_SOURCE"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Execute real full-import admission, canonicality and restart regression
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/worker-d-scratch"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/core"
          cp reports/electroneum/D/test_historical_roots_test.go "$scratch/core/worker_d_historical_roots_test.go"
          cp reports/electroneum/D/test_historical_import_test.go "$scratch/core/worker_d_historical_import_test.go"
          cd "$scratch"
          go test -count=1 -timeout=15m -run '^(TestWorkerDHistoricalCommitments|TestWorkerDHistoricalImportAdmission)$' -v ./core
          echo "WORKER_D_FULL_IMPORT_BASELINE_PASS"
      - name: Inject a weakened transaction-root guard in disposable scratch and prove test detects it
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/worker-d-scratch"
          chmod u+w "$scratch/core/block_validator.go"
          python3 - "$scratch/core/block_validator.go" <<'PY'
          import pathlib,sys
          path=pathlib.Path(sys.argv[1])
          data=path.read_text()
          needle='hash != header.TxHash'
          assert data.count(needle)==1, "guard mutation anchor missing/ambiguous"
          path.write_text(data.replace(needle, 'false', 1))
          PY
          cd "$scratch"
          set +e
          go test -count=1 -timeout=10m -run '^TestWorkerDHistoricalImportAdmission$/^bad_transaction_root$' -v ./core > "$RUNNER_TEMP/worker-d-mutant.log" 2>&1
          mutation_exit=$?
          set -e
          cat "$RUNNER_TEMP/worker-d-mutant.log"
          if [ "$mutation_exit" -eq 0 ]; then
            echo "WORKER_D_MUTANT_NOT_DETECTED"; exit 66
          fi
          grep -q 'WORKER_D_MUTATION_ACCEPTED' "$RUNNER_TEMP/worker-d-mutant.log" || {
            echo "WORKER_D_MUTANT_FAILED_WITHOUT_EXPECTED_ADMISSION_EVIDENCE"; exit 67;
          }
          echo "WORKER_D_MUTANT_DETECTED exit=$mutation_exit"
          cp "$WINDEEP_ETN_SOURCE/core/block_validator.go" "$scratch/core/block_validator.go"
          go test -count=1 -timeout=10m -run '^TestWorkerDHistoricalImportAdmission$/^bad_transaction_root$' -v ./core
          echo "WORKER_D_GUARD_RESTORE_PASS"
      - name: Execute rewind/reimport txlookup canonicality regression
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/worker-d-scratch"
          cp reports/electroneum/D/test_rewind_txlookup_test.go "$scratch/core/worker_d_rewind_txlookup_test.go"
          cd "$scratch"
          go test -count=1 -timeout=12m -run '^TestWorkerDRewindTxLookupCanonicality$' -v ./core
          echo WORKER_D_REWIND_TXLOOKUP_RUNTIME_PASS
      - name: Test source-verified partial receipt delivery and safe retry
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/worker-d-scratch"
          chmod u+w "$scratch/eth/downloader"
          cp reports/electroneum/D/test_partial_receipt_runtime_test.go "$scratch/eth/downloader/worker_d_receipt_partial_test.go"
          cd "$scratch"
          go test -count=1 -timeout=12m -run TestWorkerDReceiptPartialDelivery -v ./eth/downloader
          echo WORKER_D_RECEIPT_PARTIAL_CHARACTERIZATION_PASS
      - name: Stateful full-import semantic adversarial fuzz campaign
        shell: bash
        env:
          AUDIT_FUZZ_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_minutes || '15' }}
        run: |
          set -euo pipefail
          minutes="$AUDIT_FUZZ_MINUTES"
          if ! [[ "$minutes" =~ ^[0-9]+$ ]] || (( minutes < 1 || minutes > 300 )); then
            echo "Invalid fuzz budget $minutes"; exit 65
          fi
          cd "$RUNNER_TEMP/worker-d-scratch"
          echo "WORKER_D_IMPORT_FUZZ_BEGIN minutes=$minutes certified_commit=$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT"
          go test -count=1 -parallel=2 -timeout=330m -fuzz='^FuzzWorkerDImportAdmission$' -fuzztime="${minutes}m" -v ./core
          echo "WORKER_D_IMPORT_FUZZ_PASS"
      - name: Publish class D final CI outcome
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: bash tools/electroneum_ci_status.sh D finish
