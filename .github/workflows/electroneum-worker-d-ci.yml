name: Electroneum Worker D certified historical roots
on:
  push:
    branches: [electroneum-sc-master-audit]
    paths:
      - .github/workflows/electroneum-worker-d-ci.yml
      - reports/electroneum/D/test_historical_root_guards.py
      - reports/electroneum/D/test_historical_roots_test.go
      - tools/electroneum_target_bootstrap.sh
      - reports/electroneum/TARGET_CERTIFICATE.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etn-worker-d-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker-d-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: electroneum-sc-master-audit
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap certified Git source
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = "7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = "de7f3c75a2db7e87a89918f1257820703d5b731e"
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = "3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b"
          echo "WORKER_D_CERTIFIED_BOOTSTRAP_PASS"
      - name: Execute source-contract and negative mutation controls
        shell: bash
        run: |
          set -euo pipefail
          python3 reports/electroneum/D/test_historical_root_guards.py "$WINDEEP_ETN_SOURCE"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Execute actual transaction and receipt root derivations
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/worker-d-scratch"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/core"
          cp reports/electroneum/D/test_historical_roots_test.go "$scratch/core/worker_d_historical_roots_test.go"
          cd "$scratch"
          go test -count=1 -timeout=8m -run '^TestWorkerDHistoricalCommitments$' -v ./core
          echo "WORKER_D_TARGET_ROOT_DERIVATION_PASS"
      # Logs only; no artifact upload.
