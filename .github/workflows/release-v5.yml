name: Windeep v5 Windows Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'app/**'
      - 'tests/**'
      - 'installer/**'
      - 'scripts/audit/**'
      - 'Windeep.spec'
      - 'requirements*.txt'
      - 'tools_config.json'
      - '.github/workflows/release-v5.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/release-v5.yml'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: windeep-v5-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      is_v5: ${{ steps.version.outputs.is_v5 }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$version" =~ ^5\.[0-9]+\.[0-9]+$ ]]; then
            echo 'is_v5=true' >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            echo 'is_v5=false' >> "$GITHUB_OUTPUT"
          fi

  release-windows:
    name: v5 Windows candidate and release
    needs: [version-check]
    if: needs.version-check.outputs.is_v5 == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: G1 Checkout candidate commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and exact checkout
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '${{ needs.version-check.outputs.version }}') { throw 'VERSION differs from version-check output' }
          $headCommit = (git rev-parse HEAD).Trim()
          if ($headCommit -ne '${{ github.sha }}') { throw "Release checkout differs from the candidate commit: $headCommit" }

      - name: Refuse an existing release tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git ls-remote --exit-code --tags origin 'refs/tags/${{ needs.version-check.outputs.tag }}'
          if ($LASTEXITCODE -eq 0) { throw 'The v5 release tag already exists; refusing to replace it.' }
          if ($LASTEXITCODE -ne 2) { throw "Could not verify release tag absence: exit $LASTEXITCODE" }

      - name: G2 Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: G3 Install runtime and development requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: G4 Phase A static audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase A
          if ($LASTEXITCODE -ne 0) { Get-Content reports/static_audit.md; exit $LASTEXITCODE }

      - name: G5 Phase B tool packaging contract audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase B
          if ($LASTEXITCODE -ne 0) { Get-Content reports/tool_liveness.md; exit $LASTEXITCODE }

      - name: G6 V3 release contract audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase V3
          if ($LASTEXITCODE -ne 0) { Get-Content reports/v3_release_audit.md; exit $LASTEXITCODE }

      - name: G7 Phase E dependency audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase E
          if ($LASTEXITCODE -ne 0) { Get-Content reports/dependency_audit.md; exit $LASTEXITCODE }

      - name: G8 Pytest with minimum 85 percent coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          python -m pytest -q --cov=app --cov=launcher --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=85
          if ($LASTEXITCODE -ne 0) { throw "pytest or total coverage gate failed: $LASTEXITCODE" }
          python scripts/audit/check_v3_coverage.py reports/coverage.xml app/v3/api.py app/v3/events.py app/v3/triage.py app/v3/reporting.py --minimum 90
          if ($LASTEXITCODE -ne 0) { throw "v3 coverage gate failed: $LASTEXITCODE" }

      - name: G9 Phase D local end-to-end audit
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase D
          if ($LASTEXITCODE -ne 0) { Get-Content reports/e2e_audit.md; exit $LASTEXITCODE }

      - name: G10 Phase F release gate
        shell: pwsh
        run: |
          Remove-Item Env:GITHUB_REF_NAME -ErrorAction SilentlyContinue
          python scripts/audit/release_audit.py --phase F
          if ($LASTEXITCODE -ne 0) { Get-Content reports/release_gate.json; exit $LASTEXITCODE }

      - name: G11 Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: G12 Download, checksum and liveness-verify portable tools
        shell: pwsh
        run: |
          # A child PowerShell process gives the script an explicit native exit
          # code; $LASTEXITCODE is otherwise unset or stale for .ps1 scripts.
          & pwsh -NoProfile -NonInteractive -File ./installer/setup_tools.ps1
          if ($LASTEXITCODE -ne 0) { throw "Tool staging failed: $LASTEXITCODE" }
          python scripts/audit/release_audit.py --phase B --require-installed
          if ($LASTEXITCODE -ne 0) { Get-Content reports/tool_liveness.md; exit $LASTEXITCODE }

      - name: G13 Bundle embedded Python 3.11 and Playwright Chromium
        shell: pwsh
        run: ./installer/install_python.ps1

      - name: G14 Build Windeep with PyInstaller
        shell: pwsh
        run: pyinstaller --clean --noconfirm Windeep.spec

      - name: G15 Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found at $iscc" }
          $version = (Get-Content VERSION -Raw).Trim()
          & $iscc "/DMyAppVersion=$version" 'installer\BugBountyInstaller.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: G16 Create portable archive
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath dist\Windeep-Portable.zip) { Remove-Item dist\Windeep-Portable.zip -Force }
          Compress-Archive -Path dist\Windeep\* -DestinationPath dist\Windeep-Portable.zip -CompressionLevel Optimal

      - name: G17 Verify installer and portable build on clean Windows runner
        shell: pwsh
        run: |
          & pwsh -NoProfile -NonInteractive -File ./scripts/audit/windows_install_audit.ps1
          if ($LASTEXITCODE -ne 0) { Get-Content reports/windows_install_audit.md; exit $LASTEXITCODE }

      - name: G18 Create exact candidate source snapshot
        shell: pwsh
        run: |
          $archive = "dist\windeep-source-${{ needs.version-check.outputs.tag }}.zip"
          git archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $archive)) { throw 'git archive failed' }

      - name: G19 Generate release notes and SBOM
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $previous = $null
          try { $previous = (git describe --tags --abbrev=0 HEAD^ 2>$null).Trim() } catch { }
          if ($previous) { $range = "$previous..HEAD"; $since = $previous } else { $range = 'HEAD'; $since = 'repository start' }
          $commits = @(git log $range --pretty=format:'- %h %s (%an)')
          $changelog = (Get-Content CHANGELOG.md -Raw).Trim()
          $gate = Get-Content reports\release_gate.json -Raw | ConvertFrom-Json
          if ($gate.decision -ne 'GO') { throw 'Refusing release notes for a NO-GO release gate' }
          $notes = [System.Collections.Generic.List[string]]::new()
          $notes.Add("# Windeep v$version") | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add("Release gate: **$($gate.decision)**") | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add('## Changelog') | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add($changelog) | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add("## Commits since $since") | Out-Null
          $notes.Add('') | Out-Null
          foreach ($commit in $commits) { $notes.Add($commit) | Out-Null }
          $notes.Add('') | Out-Null
          $notes.Add('## Verification') | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add('Verify SHA-256 hashes with `SHA256SUMS.txt`. GitHub build-provenance attestations can be checked with `gh attestation verify <asset> --repo aprashnasuraj-dev/winddeep`.') | Out-Null
          $notes | Set-Content -LiteralPath dist\RELEASE-NOTES.md -Encoding utf8
          python scripts/audit/generate_sbom.py --output dist/SBOM.json
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath dist\SBOM.json)) { throw 'SBOM generation failed' }

      - name: G20 Stage release evidence and generate final SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\reports -Force | Out-Null
          $reportNames = @('static_audit.md','tool_liveness.md','v3_release_audit.md','dependency_audit.md','e2e_audit.md','windows_install_audit.md','release_gate.json','coverage.xml')
          foreach ($name in $reportNames) {
            $source = Join-Path 'reports' $name
            if (Test-Path -LiteralPath $source) { Copy-Item $source (Join-Path 'dist\reports' $name) -Force }
          }
          $required = @(
            'Windeep-Setup.exe',
            'Windeep-Portable.zip',
            "windeep-source-${{ needs.version-check.outputs.tag }}.zip",
            'RELEASE-NOTES.md',
            'SBOM.json',
            'reports\static_audit.md',
            'reports\tool_liveness.md',
            'reports\v3_release_audit.md',
            'reports\windows_install_audit.md',
            'reports\release_gate.json'
          )
          $lines = foreach ($rel in $required) {
            $file = Join-Path 'dist' $rel
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release asset: $file" }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($rel.Replace('\','/'))"
          }
          $lines | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii

      - name: G21 Attest release artifacts with GitHub build provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/Windeep-Setup.exe
            dist/Windeep-Portable.zip
            dist/windeep-source-*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/SBOM.json
            dist/reports/static_audit.md
            dist/reports/tool_liveness.md
            dist/reports/v3_release_audit.md
            dist/reports/windows_install_audit.md
            dist/reports/release_gate.json

      - name: G22 Bind SBOM attestation to installer
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/Windeep-Setup.exe
          sbom-path: dist/SBOM.json

      - name: G23 Publish verified GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Windeep v${{ needs.version-check.outputs.version }}
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body_path: dist/RELEASE-NOTES.md
          files: |
            dist/Windeep-Setup.exe
            dist/Windeep-Portable.zip
            dist/windeep-source-*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/SBOM.json
            dist/reports/static_audit.md
            dist/reports/tool_liveness.md
            dist/reports/v3_release_audit.md
            dist/reports/dependency_audit.md
            dist/reports/e2e_audit.md
            dist/reports/windows_install_audit.md
            dist/reports/release_gate.json
            dist/reports/coverage.xml

      - name: Preserve release evidence as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windeep-${{ needs.version-check.outputs.tag }}-${{ github.sha }}-release-evidence
          if-no-files-found: warn
          path: |
            reports/
            dist/*.exe
            dist/*.zip
            dist/*.txt
            dist/*.md
            dist/*.json
            dist/reports/
