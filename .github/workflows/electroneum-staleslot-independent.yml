name: ETN Downloader Stale-Slot Independent Evidence
on:
  push:
    branches: [audit/downloader-staleslot-evidence-20261104]
    paths:
      - 'reports/electroneum/staleslot/**'
      - '.github/workflows/electroneum-staleslot-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etn-staleslot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source and test event
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable certified Electroneum revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = "7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0"
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = "de7f3c75a2db7e87a89918f1257820703d5b731e"
          test "$WINDEEP_ETN_PINNED_SOURCE_COMMIT" = "3aeb14db0d6384243302f3a025bdff904dc28bf6"
          test "$WINDEEP_ETN_ARCHIVE_SHA256" = "3ca62ab9c6951ea26cb13615d67255940e176522126f2ca7a157bf4035329d7b"
          echo "WINDEEP_ETN_SOURCE=$WINDEEP_ETN_SOURCE" >> "$GITHUB_ENV"
          echo "STALE_SLOT_IMMUTABLE_SOURCE_PASS"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false
      - name: Install full runnable PoC in scratch-only source
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/staleslot-scratch"
          mkdir -p "$scratch" "$RUNNER_TEMP/staleslot-evidence"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          chmod u+w "$scratch/eth/downloader" "$scratch/eth/downloader/queue.go"
          cp reports/electroneum/D/test_partial_receipt_runtime_test.go "$scratch/eth/downloader/worker_d_receipt_fixture_test.go"
          cp reports/electroneum/staleslot/01_downloader_stale_slot_test.go "$scratch/eth/downloader/worker_d_staleslot_test.go"
          echo "STALE_SLOT_SCRATCH=$scratch" >> "$GITHUB_ENV"
          sha256sum "$WINDEEP_ETN_SOURCE/eth/downloader/queue.go" > "$RUNNER_TEMP/original-downloader.sha256"
          echo "STALE_SLOT_FULL_FIXTURE_INSTALL_PASS"
      - name: Verify normal receipt delivery and real resync reset counterexample
        shell: bash
        run: |
          set -euo pipefail
          cd "$STALE_SLOT_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestDStaleSlotSafeControls$' -v ./eth/downloader 2>&1 | tee "$RUNNER_TEMP/staleslot-evidence/01_safe_controls.log"
          grep -Fq 'STALE_SLOT_BASELINE_VALID_DELIVERY_PASS accepted=3' "$RUNNER_TEMP/staleslot-evidence/01_safe_controls.log"
          grep -Fq 'STALE_SLOT_PREPARE_SAME_OFFSET_PASS accepted=3' "$RUNNER_TEMP/staleslot-evidence/01_safe_controls.log"
          grep -Fq 'STALE_SLOT_RESYNC_RESET_BLOCKS_STALE_RESPONSE_PASS accepted=0' "$RUNNER_TEMP/staleslot-evidence/01_safe_controls.log"
          grep -Fq 'STALE_SLOT_BAD_RECEIPT_ROOT_REJECTED_PASS' "$RUNNER_TEMP/staleslot-evidence/01_safe_controls.log"
      - name: Prove conditional nil-slot panic on actual unmodified queue implementation
        shell: bash
        run: |
          set -euo pipefail
          cd "$STALE_SLOT_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestDStaleSlotConditionalPanic$' -v ./eth/downloader 2>&1 | tee "$RUNNER_TEMP/staleslot-evidence/02_target_panic.log"
          grep -Fq 'STALE_SLOT_PRECONDITION_VERIFIED' "$RUNNER_TEMP/staleslot-evidence/02_target_panic.log"
          grep -Fq 'STALE_SLOT_TARGET_PANIC_OBSERVED' "$RUNNER_TEMP/staleslot-evidence/02_target_panic.log"
      - name: Independent strict oracle must fail before scratch guard
        shell: bash
        run: |
          set -euo pipefail
          cd "$STALE_SLOT_SCRATCH"
          set +e
          go test -count=1 -timeout=10m -run '^TestDStaleSlotFailClosedOracle$' -v ./eth/downloader > "$RUNNER_TEMP/staleslot-evidence/03_original_failing_oracle.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/staleslot-evidence/03_original_failing_oracle.log"
          test "$rc" -ne 0 || { echo STALE_SLOT_ORIGINAL_ORACLE_UNEXPECTED_PASS; exit 65; }
          grep -Fq 'STALE_SLOT_FAIL_CLOSED_ORACLE_PANIC' "$RUNNER_TEMP/staleslot-evidence/03_original_failing_oracle.log"
          echo "STALE_SLOT_ORIGINAL_SOURCE_STRICT_ORACLE_REJECTED exit=$rc"
      - name: Scratch-only guard sensitivity and repeat strict oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/reports/electroneum/staleslot/03_scratch_guard.py" "$STALE_SLOT_SCRATCH/eth/downloader/queue.go"
          cd "$STALE_SLOT_SCRATCH"
          go test -count=1 -timeout=10m -run '^(TestDStaleSlotFailClosedOracle|TestDStaleSlotSafeControls)$' -v ./eth/downloader 2>&1 | tee "$RUNNER_TEMP/staleslot-evidence/04_guard_oracle.log"
          grep -Fq 'STALE_SLOT_FAIL_CLOSED_ORACLE_PASS accepted=0 structured_error=true' "$RUNNER_TEMP/staleslot-evidence/04_guard_oracle.log"
          cd "$GITHUB_WORKSPACE"
          sha256sum --check "$RUNNER_TEMP/original-downloader.sha256"
          git diff --exit-code -- vendor/electroneum-sc
          echo "STALE_SLOT_SCRATCH_GUARD_AND_IMMUTABLE_TARGET_PASS"
      - name: Verify EXACT bundled reproduction script end to end
        shell: bash
        run: |
          set -euo pipefail
          bash reports/electroneum/staleslot/04_REPRODUCE_EXACT.sh "$WINDEEP_ETN_SOURCE" "$RUNNER_TEMP/staleslot-exact"
          grep -Fq 'STALE_SLOT_TARGET_PANIC_OBSERVED' "$RUNNER_TEMP/staleslot-exact/02_target_panic.log"
          grep -Fq 'STALE_SLOT_FAIL_CLOSED_ORACLE_PANIC' "$RUNNER_TEMP/staleslot-exact/03_original_failing_oracle.log"
          grep -Fq 'STALE_SLOT_FAIL_CLOSED_ORACLE_PASS' "$RUNNER_TEMP/staleslot-exact/04_guard_oracle.log"
          cp "$RUNNER_TEMP/staleslot-exact/"*.log "$RUNNER_TEMP/staleslot-evidence/"
          echo STALE_SLOT_EXACT_BUNDLE_SCRIPT_VERIFIED_PASS
      - name: Export exact complete source code and reproduction artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp reports/electroneum/staleslot/01_downloader_stale_slot_test.go "$RUNNER_TEMP/staleslot-evidence/01_downloader_stale_slot_test.go"
          cp reports/electroneum/D/test_partial_receipt_runtime_test.go "$RUNNER_TEMP/staleslot-evidence/02_base_receipt_fixture_test.go"
          cp reports/electroneum/staleslot/03_scratch_guard.py "$RUNNER_TEMP/staleslot-evidence/03_scratch_guard.py"
          cp reports/electroneum/staleslot/04_REPRODUCE_EXACT.sh "$RUNNER_TEMP/staleslot-evidence/04_REPRODUCE_EXACT.sh"
          sha256sum "$RUNNER_TEMP/staleslot-evidence/"*.go > "$RUNNER_TEMP/staleslot-evidence/P0C_SHA256.txt"
      - name: Publish reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staleslot-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/staleslot-evidence/
          if-no-files-found: warn
          retention-days: 14
