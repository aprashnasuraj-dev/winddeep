name: Windeep v6 Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'RELEASE_CHECKLIST.md'
      - 'app/**'
      - 'tests/**'
      - 'installer/**'
      - 'scripts/audit/**'
      - 'Windeep.spec'
      - 'requirements*.txt'
      - 'tools_config.json'
      - '.github/workflows/release-v6.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'RELEASE_CHECKLIST.md'
      - 'app/**'
      - 'tests/**'
      - 'installer/**'
      - 'scripts/audit/**'
      - 'Windeep.spec'
      - 'requirements*.txt'
      - 'tools_config.json'
      - '.github/workflows/release-v6.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: windeep-v6-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      is_v6: ${{ steps.version.outputs.is_v6 }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^6\.[0-9]+\.[0-9]+$ ]]; then
            echo 'is_v6=true' >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            echo 'is_v6=false' >> "$GITHUB_OUTPUT"
            echo 'tag=' >> "$GITHUB_OUTPUT"
          fi

  qualification:
    name: V6 contract ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: ${{ github.workspace }}
      WINDEEP_BRAIN_LLM_PROVIDER: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile V6 runtime and audit harnesses
        run: |
          python -m compileall -q app launcher.py scripts/audit/v6_release_gate.py scripts/audit/v6_browser_stress.py
      - name: V6 proof, progress, recon and recovery tests
        run: |
          python -m pytest -q tests/test_v6_progress_ui.py tests/test_v6_observation_submission_gate.py tests/test_v6_proof_validators.py tests/test_v6_recon_pagination.py tests/test_event_bus.py tests/test_scheduler.py tests/test_p0_pipeline.py tests/test_v2_product.py tests/test_v5_alignment_submission.py tests/test_p4_hard_middle.py
      - name: V3 compatibility release audit
        run: python scripts/audit/release_audit.py --phase V3
      - name: V6 fail-closed source contract gate
        run: python scripts/audit/v6_release_gate.py --mode preflight
      - name: Runtime backend/readiness snapshot
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set +e
          python launcher.py doctor --backends --json > reports/v6-doctor-backends-${{ runner.os }}.json
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 3 ]]; then exit "$rc"; fi
      - name: Runtime backend/readiness snapshot (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          python launcher.py doctor --backends --json | Out-File -Encoding utf8 reports/v6-doctor-backends-Windows.json
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and $rc -ne 3) { throw "doctor --backends failed unexpectedly: $rc" }
      - name: Linux offline/no-AI application smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          state="$(mktemp -d)"
          WINDEEP_STATE_DIR="$state" python - <<'PY'
          from app.server import create_app
          app = create_app()
          client = app.test_client()
          health = client.get('/api/health')
          assert health.status_code == 200, health.get_data(as_text=True)
          payload = health.get_json()
          assert payload['status'] == 'ok'
          assert payload['integrations_total'] == 137
          print(payload)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v6-contract-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: warn
          path: reports/

  browser-stress:
    name: V6 dashboard reconnect stress
    needs: [version-check, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and Chromium
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run reconnect/UI stress
        shell: bash
        run: |
          if [[ '${{ needs.version-check.outputs.is_v6 }}' == 'true' ]]; then
            duration=1800
          else
            duration=90
          fi
          python scripts/audit/v6_browser_stress.py             --duration-seconds "$duration"             --events-per-cycle 1000             --output reports/v6_browser_stress.json             --screenshot reports/v6_browser_stress.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v6-browser-stress-${{ github.sha }}
          if-no-files-found: error
          path: |
            reports/v6_browser_stress.json
            reports/v6_browser_stress.png
            reports/v6_browser_stress.server.log

  release-windows:
    name: V6 Windows candidate and release
    needs: [version-check, qualification, browser-stress]
    if: needs.version-check.outputs.is_v6 == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
      WINDEEP_BRAIN_LLM_PROVIDER: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - name: G1 Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate exact version and commit
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '${{ needs.version-check.outputs.version }}') { throw 'VERSION drifted' }
          $headCommit = (git rev-parse HEAD).Trim()
          if ($headCommit -ne '${{ github.sha }}') { throw "Candidate checkout mismatch: $headCommit" }
      - name: Refuse existing V6 release tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $existingTag = @(git ls-remote --tags origin 'refs/tags/${{ needs.version-check.outputs.tag }}')
          if ($LASTEXITCODE -ne 0) { throw "Could not verify tag absence: $LASTEXITCODE" }
          if ($existingTag.Count -gt 0) { throw 'V6 release tag already exists; refusing replacement.' }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: G2 Install requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: G3 Static/tool/V3/dependency audits
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase A
          if ($LASTEXITCODE -ne 0) { Get-Content reports/static_audit.md; exit $LASTEXITCODE }
          python scripts/audit/release_audit.py --phase B
          if ($LASTEXITCODE -ne 0) { Get-Content reports/tool_liveness.md; exit $LASTEXITCODE }
          python scripts/audit/release_audit.py --phase V3
          if ($LASTEXITCODE -ne 0) { Get-Content reports/v3_release_audit.md; exit $LASTEXITCODE }
          python scripts/audit/release_audit.py --phase E
          if ($LASTEXITCODE -ne 0) { Get-Content reports/dependency_audit.md; exit $LASTEXITCODE }
      - name: G4 Final V6 contract gate
        shell: pwsh
        run: |
          python scripts/audit/v6_release_gate.py --mode final
          if ($LASTEXITCODE -ne 0) { Get-Content reports/v6_release_gate.json; exit $LASTEXITCODE }
      - name: G5 Full pytest and coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          python -m pytest -q --cov=app --cov=launcher --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=85
          if ($LASTEXITCODE -ne 0) { throw "pytest/coverage gate failed: $LASTEXITCODE" }
          python scripts/audit/check_v3_coverage.py reports/coverage.xml app/v3/api.py app/v3/events.py app/v3/triage.py app/v3/reporting.py --minimum 90
          if ($LASTEXITCODE -ne 0) { throw "v3 coverage gate failed: $LASTEXITCODE" }
      - name: G6 Local E2E and release gate
        shell: pwsh
        run: |
          python scripts/audit/release_audit.py --phase D
          if ($LASTEXITCODE -ne 0) { Get-Content reports/e2e_audit.md; exit $LASTEXITCODE }
          Remove-Item Env:GITHUB_REF_NAME -ErrorAction SilentlyContinue
          python scripts/audit/release_audit.py --phase F
          if ($LASTEXITCODE -ne 0) { Get-Content reports/release_gate.json; exit $LASTEXITCODE }
      - name: G7 Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: G8 Stage and verify portable tools
        shell: pwsh
        run: |
          & pwsh -NoProfile -NonInteractive -File ./installer/setup_tools.ps1
          if ($LASTEXITCODE -ne 0) { throw "Tool staging failed: $LASTEXITCODE" }
          python scripts/audit/release_audit.py --phase B --require-installed
          if ($LASTEXITCODE -ne 0) { Get-Content reports/tool_liveness.md; exit $LASTEXITCODE }
      - name: G9 Bundle embedded Python and Chromium
        shell: pwsh
        run: ./installer/install_python.ps1
      - name: G10 Build PyInstaller application
        shell: pwsh
        run: pyinstaller --clean --noconfirm Windeep.spec
      - name: G11 Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe missing: $iscc" }
          $version = (Get-Content VERSION -Raw).Trim()
          & $iscc "/DMyAppVersion=$version" 'installer\BugBountyInstaller.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: G12 Create portable archive
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath dist\Windeep-Portable.zip) { Remove-Item dist\Windeep-Portable.zip -Force }
          Compress-Archive -Path dist\Windeep\* -DestinationPath dist\Windeep-Portable.zip -CompressionLevel Optimal
      - name: G13 Clean install/upgrade/uninstall/portable audit
        shell: pwsh
        run: |
          & pwsh -NoProfile -NonInteractive -File ./scripts/audit/windows_install_audit.ps1
          if ($LASTEXITCODE -ne 0) { Get-Content reports/windows_install_audit.md; exit $LASTEXITCODE }
      - name: G14 Exact candidate source snapshot
        shell: pwsh
        run: |
          $archive = "dist\windeep-source-${{ needs.version-check.outputs.tag }}.zip"
          git archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $archive)) { throw 'git archive failed' }
      - name: G15 Generate release notes and SBOM
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $previous = $null
          try { $previous = (git describe --tags --abbrev=0 HEAD^ 2>$null).Trim() } catch { }
          if ($previous) { $range = "$previous..HEAD"; $since = $previous } else { $range = 'HEAD'; $since = 'repository start' }
          $commits = @(git log $range --pretty=format:'- %h %s (%an)')
          $gate = Get-Content reports\release_gate.json -Raw | ConvertFrom-Json
          $v6gate = Get-Content reports\v6_release_gate.json -Raw | ConvertFrom-Json
          if ($gate.decision -ne 'GO' -or $v6gate.decision -ne 'GO') { throw 'Refusing V6 release notes for a NO-GO gate' }
          $notes = [System.Collections.Generic.List[string]]::new()
          $notes.Add("# Windeep v$version") | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add('Release gates: **GO** (general + V6).') | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add('## V6 highlights') | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add('- Durable live scan progress, reconnect reconciliation, cancellation and restart recovery.') | Out-Null
          $notes.Add('- Recon observations separated from vulnerability findings and submission candidates.') | Out-Null
          $notes.Add('- Five controlled proof validators with matched patched negative controls.') | Out-Null
          $notes.Add('- Evidence-bound submission readiness with mandatory verification, triage and human approval.') | Out-Null
          $notes.Add('- Honest runtime readiness/probe states and bounded event/UI backpressure.') | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add("## Commits since $since") | Out-Null
          $notes.Add('') | Out-Null
          foreach ($commit in $commits) { $notes.Add($commit) | Out-Null }
          $notes.Add('') | Out-Null
          $notes.Add('## Verification') | Out-Null
          $notes.Add('') | Out-Null
          $notes.Add('Verify SHA-256 hashes with SHA256SUMS.txt and GitHub build-provenance attestations.') | Out-Null
          $notes | Set-Content -LiteralPath dist\RELEASE-NOTES.md -Encoding utf8
          python scripts/audit/generate_sbom.py --output dist/SBOM.json
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath dist\SBOM.json)) { throw 'SBOM generation failed' }
      - name: G16 Stage release evidence and hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\reports -Force | Out-Null
          $reportNames = @('static_audit.md','tool_liveness.md','v3_release_audit.md','dependency_audit.md','e2e_audit.md','windows_install_audit.md','release_gate.json','v6_release_gate.json','coverage.xml')
          foreach ($name in $reportNames) {
            $source = Join-Path 'reports' $name
            if (Test-Path -LiteralPath $source) { Copy-Item $source (Join-Path 'dist\reports' $name) -Force }
          }
          $required = @(
            'Windeep-Setup.exe',
            'Windeep-Portable.zip',
            "windeep-source-${{ needs.version-check.outputs.tag }}.zip",
            'RELEASE-NOTES.md',
            'SBOM.json',
            'reports\static_audit.md',
            'reports\tool_liveness.md',
            'reports\v3_release_audit.md',
            'reports\windows_install_audit.md',
            'reports\release_gate.json',
            'reports\v6_release_gate.json'
          )
          $lines = foreach ($rel in $required) {
            $file = Join-Path 'dist' $rel
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release asset: $file" }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($rel.Replace('\','/'))"
          }
          $lines | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii
      - name: G17 Attest V6 artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/Windeep-Setup.exe
            dist/Windeep-Portable.zip
            dist/windeep-source-*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/SBOM.json
            dist/reports/v6_release_gate.json
            dist/reports/release_gate.json
      - name: G18 Bind SBOM attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: dist/Windeep-Setup.exe
          sbom-path: dist/SBOM.json
      - name: G19 Publish verified V6 GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Windeep v${{ needs.version-check.outputs.version }}
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body_path: dist/RELEASE-NOTES.md
          files: |
            dist/Windeep-Setup.exe
            dist/Windeep-Portable.zip
            dist/windeep-source-*.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/SBOM.json
            dist/reports/*.md
            dist/reports/*.json
            dist/reports/coverage.xml
      - name: Preserve V6 candidate/release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windeep-${{ needs.version-check.outputs.tag }}-${{ github.sha }}-v6-release-evidence
          if-no-files-found: warn
          path: |
            reports/
            dist/*.exe
            dist/*.zip
            dist/*.txt
            dist/*.md
            dist/*.json
            dist/reports/
