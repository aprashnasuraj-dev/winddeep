name: Electroneum Worker R - Production Depth Verification

on:
  push:
    branches:
      - 'audit/r-production-depth-20261104-*'
      - '!audit/r-production-depth-20261104-seed'
    paths:
      - 'reports/electroneum/R/production_depth/**'
      - '.github/workflows/electroneum-r-production-depth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-production-depth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pin exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select one production-depth campaign
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          selector="$(tr -d '\n' < reports/electroneum/R/production_depth/selection.txt)"
          test "$GITHUB_REF_NAME" = "audit/r-production-depth-20261104-$selector"
          case "$selector" in
            01-full-backend) mode=full ;;
            02-persist-restart) mode=persist ;;
            03-parser-budgets) mode=parser ;;
            04-priority-consensus) mode=priority ;;
            05-persist-abrupt-exit) mode=persist ;;
            06-peer-downloader-reorg) mode=peer ;;
            07-devp2p-loopback) mode=devp2p ;;
            08-qbft-quorum-gate) mode=qbft ;;
            09-qbft-devp2p-e2e) mode=qbftnet ;;
            10-waitmined-impact) mode=impact ;;
            11-guard-residual) mode=guardresidual ;;
            12-lower-authority-peer) mode=lowerauth ;;
            13-consumer-finality) mode=consumerfinality ;;
            14-leveldb-wal-fault) mode=walfault ;;
            *) echo R_PROD_DEPTH_BAD_SELECTOR; exit 64 ;;
          esac
          echo "R_PROD_SELECTOR=$selector" >> "$GITHUB_ENV"
          echo "R_PROD_MODE=$mode" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/r-prod-evidence"
          printf 'selector=%s\nevent_sha=%s\n' "$selector" "$GITHUB_SHA" > "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: Certify immutable target
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = 7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = de7f3c75a2db7e87a89918f1257820703d5b731e
          {
            echo "certified_source=$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT"
            echo "certified_tree=$WINDEEP_ETN_SOURCE_TREE_SHA"
            echo "G1_source_identity=PASS"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: Set up Go 1.24.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.0'
          cache: false

      - name: Mount only Worker R tests in disposable source
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/r-prod-depth-$R_PROD_SELECTOR"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          case "$R_PROD_MODE" in
            full)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_prod_depth_test.go"
              ;;
            persist)
              chmod u+w "$scratch/core"
              cp reports/electroneum/R/production_depth/persistent_sync_restart_test.go "$scratch/core/worker_r_prod_depth_test.go"
              ;;
            parser)
              chmod u+w "$scratch/rpc" "$scratch/accounts/abi" "$scratch/core/types"
              cp reports/electroneum/R/production_depth/parser_rpc_limit_test.go "$scratch/rpc/worker_r_prod_depth_test.go"
              cp reports/electroneum/R/production_depth/parser_abi_limit_test.go "$scratch/accounts/abi/worker_r_prod_depth_test.go"
              cp reports/electroneum/R/production_depth/parser_tx_receipt_limit_test.go "$scratch/core/types/worker_r_prod_depth_test.go"
              ;;
            priority)
              chmod u+w "$scratch/core"
              cp reports/electroneum/R/production_depth/priority_consensus_integration_test.go "$scratch/core/worker_r_prod_depth_test.go"
              ;;
            peer)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_test.go"
              ;;
            devp2p)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_helper_test.go"
              cp reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go "$scratch/eth/worker_r_devp2p_loopback_test.go"
              ;;
            qbft)
              chmod u+w "$scratch/consensus/istanbul/backend"
              cp reports/electroneum/R/production_depth/qbft_quorum_gate_test.go "$scratch/consensus/istanbul/backend/worker_r_qbft_quorum_gate_test.go"
              ;;
            qbftnet)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_helper_test.go"
              cp reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go "$scratch/eth/worker_r_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_devp2p_reorg_test.go "$scratch/eth/worker_r_qbft_devp2p_test.go"
              ;;
            impact)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/waitmined_impact_test.go "$scratch/eth/worker_r_waitmined_impact_test.go"
              ;;
            guardresidual)
              chmod u+w "$scratch/eth" "$scratch/internal/ethapi" "$scratch/internal/ethapi/api.go"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/canonical_guard_residual_test.go "$scratch/eth/worker_r_guard_residual_test.go"
              python3 reports/electroneum/R/production_depth/canonical_guard_residual_patch.py "$scratch/internal/ethapi/api.go"
              ;;
            lowerauth)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_helper_test.go"
              cp reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go "$scratch/eth/worker_r_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_devp2p_reorg_test.go "$scratch/eth/worker_r_qbft_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/lower_authority_peer_test.go "$scratch/eth/worker_r_lower_authority_peer_test.go"
              ;;
            walfault)
              chmod u+w "$scratch/core"
              cp reports/electroneum/R/production_depth/persistent_sync_restart_test.go "$scratch/core/worker_r_persist_helper_test.go"
              cp reports/electroneum/R/production_depth/persistent_wal_fault_test.go "$scratch/core/worker_r_wal_fault_test.go"
              ;;
            consumerfinality)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_helper_test.go"
              cp reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go "$scratch/eth/worker_r_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_devp2p_reorg_test.go "$scratch/eth/worker_r_qbft_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/lower_authority_peer_test.go "$scratch/eth/worker_r_lower_authority_peer_helper_test.go"
              cp reports/electroneum/R/production_depth/consumer_finality_test.go "$scratch/eth/worker_r_consumer_finality_test.go"
              ;;
          esac
          echo "R_PROD_SCRATCH=$scratch" >> "$GITHUB_ENV"

      - name: P1 full BlockChain and EthAPIBackend reorg
        if: env.R_PROD_MODE == 'full'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestRFullBackend' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/full_backend.log"
          grep -Fq 'R_FULL_BACKEND_TOCTOU_ORACLE_MISMATCH' "$RUNNER_TEMP/r-prod-evidence/full_backend.log"
          grep -Fq 'R_FULL_BACKEND_PEER_EQUIVALENT_INSERTCHAIN_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/full_backend.log"
          {
            echo "G2_positive_control=PASS"
            echo "G3_named_oracle=PASS"
            echo "G4_reproducer=reports/electroneum/R/production_depth/full_backend_reorg_test.go"
            echo "G6_production_reachability=OPEN_peer_equivalent_InsertChain_not_devp2p"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1b downloader Peer and LegacySync reorg reachability
        if: env.R_PROD_MODE == 'peer'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestRPeerDownloaderReorgRace$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/peer_downloader.log"
          grep -Fq 'R_PEER_DOWNLOADER_REORG_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/peer_downloader.log"
          if grep -Fq 'R_PEER_DOWNLOADER_TOCTOU_OBSERVED' "$RUNNER_TEMP/r-prod-evidence/peer_downloader.log"; then
            echo "G6_peer_downloader_reachability=OBSERVED_IN_SYNTHETIC_PROTOCOL_PEER" >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"
          else
            echo "G6_peer_downloader_reachability=NOT_OBSERVED_IN_BOUNDED_CAMPAIGN" >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"
          fi
          {
            echo "G2_positive_control=PASS_real_downloader_LegacySync"
            echo "G4_reproducer=reports/electroneum/R/production_depth/peer_downloader_reorg_test.go"
            echo "external_public_network=NOT_USED"
            echo "QBFT_validator_adversary=NOT_TESTED"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1c real loopback TCP RLPx devp2p reorg reachability
        if: env.R_PROD_MODE == 'devp2p'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=15m -run '^TestRDevP2PLoopbackReorgReachability$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/devp2p_loopback.log"
          grep -Fq 'R_DEVP2P_TCP_RLPX_PEER_CONNECTED' "$RUNNER_TEMP/r-prod-evidence/devp2p_loopback.log"
          grep -Fq 'R_DEVP2P_DOWNLOADER_REORG_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/devp2p_loopback.log"
          {
            echo "G2_positive_control=PASS_real_TCP_RLPx_ETH66_peer"
            echo "G4_reproducer=reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go"
            echo "G6_transport_reachability=PARTIAL_REAL_LOOPBACK_TCP_RLPx_DEVP2P_TO_DOWNLOADER"
            echo "external_public_network=NOT_USED"
            echo "QBFT_valid_competing_fork_adversary=NOT_ESTABLISHED"
            echo "G7_concrete_downstream_impact=OPEN"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1d QBFT validator-quorum import gate
        if: env.R_PROD_MODE == 'qbft'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestRQBFTQuorumGate$' -v ./consensus/istanbul/backend 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/qbft_quorum.log"
          grep -Fq 'R_QBFT_QUORUM_MATRIX_PASS' "$RUNNER_TEMP/r-prod-evidence/qbft_quorum.log"
          grep -Fq 'R_QBFT_SUBQUORUM_REJECTED validators=4 seals=2 required=3' "$RUNNER_TEMP/r-prod-evidence/qbft_quorum.log"
          grep -Fq 'R_QBFT_SUBQUORUM_REJECTED validators=7 seals=4 required=5' "$RUNNER_TEMP/r-prod-evidence/qbft_quorum.log"
          grep -Fq 'R_QBFT_OUTSIDER_REJECTED' "$RUNNER_TEMP/r-prod-evidence/qbft_quorum.log"
          {
            echo "G2_positive_control=PASS_exact_QBFT_quorum_import"
            echo "G5_counterexample=PASS_subquorum_duplicate_outsider_rejected"
            echo "G6_consensus_precondition=QBFT_VALID_COMPETING_FORK_REQUIRES_CEIL_2N_OVER_3_UNIQUE_VALIDATOR_SEALS"
            echo "ordinary_external_peer_without_validator_keys=REJECTED_BY_CONSENSUS_GATE"
            echo "validator_quorum_adversary_or_legitimate_competing_finality=NOT_ESTABLISHED"
            echo "G7_concrete_downstream_impact=OPEN"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1e quorum-authorized QBFT branch over real devp2p
        if: env.R_PROD_MODE == 'qbftnet'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=15m -run '^TestRQBFTDevP2PQuorumReorgRace$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/qbft_devp2p.log"
          grep -Fq 'R_QBFT_DEVP2P_QUORUM_BRANCH_BUILT validators=4 quorum=3' "$RUNNER_TEMP/r-prod-evidence/qbft_devp2p.log"
          grep -Fq 'R_QBFT_DEVP2P_TCP_RLPX_CONNECTED' "$RUNNER_TEMP/r-prod-evidence/qbft_devp2p.log"
          grep -Fq 'R_QBFT_DEVP2P_QUORUM_REORG_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/qbft_devp2p.log"
          {
            echo "G2_positive_control=PASS_quorum_authorized_QBFT_branch"
            echo "G6_conditional_reachability=QUORUM_AUTHORIZED_BRANCH_OVER_REAL_TCP_RLPx_DEVP2P"
            echo "actor_requirement=CEIL_2N_OVER_3_VALIDATOR_KEYS_IN_FIXTURE"
            echo "ordinary_external_peer=NOT_THIS_ACTOR_MODEL"
            echo "G7_concrete_downstream_impact=OPEN"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1f shipped bind WaitMined client-integrity impact
        if: env.R_PROD_MODE == 'impact'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestRWaitMinedStaleReceiptImpact$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/waitmined_impact.log"
          grep -Fq 'R_WAITMINED_STALE_MINED_SIGNAL' "$RUNNER_TEMP/r-prod-evidence/waitmined_impact.log"
          grep -Fq 'R_WAITMINED_CANONICAL_RECHECK_REJECTS_PASS' "$RUNNER_TEMP/r-prod-evidence/waitmined_impact.log"
          grep -Fq 'R_WAITMINED_POST_REORG_NOTFOUND_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/waitmined_impact.log"
          grep -Fq 'R_WAITMINED_G7_CLIENT_INTEGRITY_IMPACT_PASS' "$RUNNER_TEMP/r-prod-evidence/waitmined_impact.log"
          {
            echo "G7_client_integrity=SHIPPED_BIND_WAITMINED_RETURNS_NONCANONICAL_RECEIPT"
            echo "G7_counterexample=SHIPPED_ETHCLIENT_CANONICAL_HEADER_RECHECK_REJECTS"
            echo "financial_loss=NOT_CLAIMED"
            echo "ordinary_external_peer_actor=NOT_ESTABLISHED"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1g candidate canonical guard residual TOCTOU
        if: env.R_PROD_MODE == 'guardresidual'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestRCanonicalGuardResidualRace$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/guard_residual.log"
          grep -Fq 'R_CANONICAL_GUARD_RESIDUAL_TOCTOU_OBSERVED' "$RUNNER_TEMP/r-prod-evidence/guard_residual.log"
          grep -Fq 'R_CANONICAL_GUARD_NOT_COMPLETE_FIX_PASS' "$RUNNER_TEMP/r-prod-evidence/guard_residual.log"
          {
            echo "candidate_post_read_canonical_guard=INCOMPLETE"
            echo "residual_race=REORG_AFTER_CANONICAL_READ_BEFORE_RETURN"
            echo "mitigation_requirement=ATOMIC_CHAIN_VIEW_OR_CLIENT_REORG_AWARE_SEMANTICS"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1h lower-authority subquorum over real ETH66/downloader
        if: env.R_PROD_MODE == 'lowerauth'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestRP1H(QuorumWirePositiveControl|LowerAuthoritySubquorumRejected)$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/lower_authority_peer.log"
          grep -Fq 'R_P1H_QUORUM_ETH66_DOWNLOADER_ACCEPTED validators=4 seals=3' "$RUNNER_TEMP/r-prod-evidence/lower_authority_peer.log"
          grep -Fq 'R_P1H_QUORUM_WIRE_POSITIVE_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/lower_authority_peer.log"
          grep -Fq 'R_P1H_SUBQUORUM_DIRECT_VERIFIER_REJECTED validators=4 seals=2' "$RUNNER_TEMP/r-prod-evidence/lower_authority_peer.log"
          grep -Fq 'R_P1H_SUBQUORUM_ETH66_DOWNLOADER_REJECTED validators=4 seals=2' "$RUNNER_TEMP/r-prod-evidence/lower_authority_peer.log"
          grep -Fq 'R_P1H_LOWER_AUTHORITY_CANNOT_REPRODUCE_RECEIPT_INCONSISTENCY_PASS' "$RUNNER_TEMP/r-prod-evidence/lower_authority_peer.log"
          {
            echo "G2_positive_control=PASS_same_custom_ETH66_wire_peer_3_of_4_quorum_imported"
            echo "G5_counterexample=PASS_2_of_4_subquorum_rejected_after_real_ETH66_header_body_delivery"
            echo "G6_ordinary_peer_finalized_competing_branch=DISPROVEN_IN_TESTED_2_OF_4_MODEL"
            echo "receipt_inconsistency_lower_authority=NOT_REPRODUCED"
            echo "transport=REAL_LOOPBACK_TCP_RLPx_ETN66"
            echo "sync_path=REAL_DOWNLOADER_LegacySync"
            echo "remote_invalid_block_preimport=NONE_peer_served_wire_object_directly"
            echo "G4_reproducer=reports/electroneum/R/production_depth/lower_authority_peer_test.go"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1i synthetic consumer decisions and QBFT finalized-tag visibility
        if: env.R_PROD_MODE == 'consumerfinality'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestRP1I' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/consumer_finality.log"
          grep -Fq 'R_P1I_MINED_POLICY_FALSE_CREDIT_REPRODUCED' "$RUNNER_TEMP/r-prod-evidence/consumer_finality.log"
          grep -Fq 'R_P1I_NAIVE_NCONF_FALSE_CREDIT_REPRODUCED n=4' "$RUNNER_TEMP/r-prod-evidence/consumer_finality.log"
          grep -Fq 'R_P1I_CANONICAL_NCONF_REJECTS_STALE_PASS' "$RUNNER_TEMP/r-prod-evidence/consumer_finality.log"
          grep -Fq 'R_P1I_QBFT_COMMITTED_BLOCK_CONTROL_PASS validators=4 seals=3' "$RUNNER_TEMP/r-prod-evidence/consumer_finality.log"
          grep -Fq 'R_P1I_QBFT_FINALIZED_TAG_UNPUBLISHED_PASS' "$RUNNER_TEMP/r-prod-evidence/consumer_finality.log"
          grep -Fq 'R_P1I_SYNTHETIC_CONSUMER_ONLY_NO_REAL_EXCHANGE_CLAIM' "$RUNNER_TEMP/r-prod-evidence/consumer_finality.log"
          {
            echo "G2_positive_control=PASS_shipped_WaitMined_and_3_of_4_QBFT_committed_block"
            echo "synthetic_mined_policy=FALSE_CREDIT_REPRODUCED"
            echo "synthetic_naive_4_confirmation_policy=FALSE_CREDIT_REPRODUCED"
            echo "G5_counterexample=PASS_canonical_hash_aware_confirmation_policy_rejects"
            echo "qbft_generic_finalized_tag=UNPUBLISHED_AFTER_VALID_COMMITTED_BLOCK_IMPORT"
            echo "G7_real_third_party_integration=OPEN_NOT_TESTED"
            echo "financial_loss=NOT_CLAIMED"
            echo "G4_reproducer=reports/electroneum/R/production_depth/consumer_finality_test.go"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P2b LevelDB write-ahead log tail fault recovery
        if: env.R_PROD_MODE == 'walfault'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestRLevelDBWALTailFaultMatrix$' -v ./core 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/wal_tail_fault.log"
          grep -Fq 'R_WAL_FAULT_MATRIX_PASS' "$RUNNER_TEMP/r-prod-evidence/wal_tail_fault.log"
          {
            echo "G2_positive_control=PASS_clean_unclean_exit_recovery"
            echo "fault_model=SYNTHETIC_LEVELDB_WAL_TAIL_TRUNCATION_OR_BITFLIP_AFTER_PROCESS_EXIT"
            echo "G4_reproducer=reports/electroneum/R/production_depth/persistent_wal_fault_test.go"
            echo "G6_remote_reachability=NOT_ESTABLISHED"
            echo "G7_security_impact=NOT_CLAIMED"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P2 persistent crash and replay checkpoints
        if: env.R_PROD_MODE == 'persist'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestRPersistent' -v ./core 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/persist.log"
          grep -Fq 'R_PERSIST_RESTART_STAGE_PASS stage=complete' "$RUNNER_TEMP/r-prod-evidence/persist.log"
          grep -Fq 'R_PERSIST_CORRUPTION_CONTROL_DETECTED_PASS' "$RUNNER_TEMP/r-prod-evidence/persist.log"
          if [ "$R_PROD_SELECTOR" = "05-persist-abrupt-exit" ]; then
            grep -Fq 'R_PERSIST_ABRUPT_EXIT_MATRIX_PASS' "$RUNNER_TEMP/r-prod-evidence/persist.log"
            echo "abrupt_process_exit_without_db_close=PASS" >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"
          fi
          {
            echo "G2_positive_control=PASS"
            echo "G3_named_oracle=PASS_commitment_and_restart_matrix"
            echo "G4_reproducer=reports/electroneum/R/production_depth/persistent_sync_restart_test.go"
            echo "G6_production_reachability=LOCAL_CRASH_STAGE_MODEL_not_powercut_fault_injection"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P3 compile realistic-size parser binaries
        if: env.R_PROD_MODE == 'parser'
        shell: bash
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -c -o "$RUNNER_TEMP/rpc-budget.test" ./rpc
          go test -c -o "$RUNNER_TEMP/abi-budget.test" ./accounts/abi
          go test -c -o "$RUNNER_TEMP/types-budget.test" ./core/types
          echo G2_compile_and_fixture_setup=PASS >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P3 hard memory CPU and wall-time budgets
        if: env.R_PROD_MODE == 'parser'
        shell: bash
        run: |
          set -euo pipefail
          run_budget() {
            name="$1"; bin="$2"; pattern="$3"
            (
              ulimit -t 45
              timeout --signal=KILL 60s /usr/bin/time -v env GOMEMLIMIT=512MiB GOMAXPROCS=2 "$bin" -test.run "$pattern" -test.v
            ) 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/$name.log"
          }
          run_budget rpc "$RUNNER_TEMP/rpc-budget.test" '^TestRRealisticRPCBodyBudgets$'
          run_budget abi "$RUNNER_TEMP/abi-budget.test" '^TestRRealisticNestedABIResourceBudgets$'
          run_budget types "$RUNNER_TEMP/types-budget.test" '^TestRRealisticRawTransactionAndReceiptDecodeBudgets$'
          grep -Fq 'R_PARSER_RPC_NEAR_LIMIT_PASS' "$RUNNER_TEMP/r-prod-evidence/rpc.log"
          grep -Fq 'R_ABI_REALISTIC_SIZE_PASS requested=4194304' "$RUNNER_TEMP/r-prod-evidence/abi.log"
          grep -Fq 'R_TX_REALISTIC_RAW_DECODE_PASS' "$RUNNER_TEMP/r-prod-evidence/types.log"
          grep -Fq 'R_RECEIPT_REALISTIC_LOG_DECODE_PASS' "$RUNNER_TEMP/r-prod-evidence/types.log"
          {
            echo "G2_positive_control=PASS"
            echo "G3_named_resource_oracles=PASS"
            echo "G4_reproducer=three_committed_realistic_size_tests"
            echo "hard_memory_budget=512MiB_GOMEMLIMIT"
            echo "hard_cpu_budget=45s_per_binary"
            echo "hard_wall_budget=60s_per_binary"
            echo "G6_production_reachability=PARTIAL_real_parser_sizes_no_external_socket"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P4 actual priority execution characterization
        if: env.R_PROD_MODE == 'priority'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=8m -run '^TestRPriorityExecutionPoolCharacterization$' -v ./core 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/priority_characterization.log"
          grep -Fq 'R_PRIORITY_ACTUAL_BLOCK_EXECUTION_TRANSITION_PASS' "$RUNNER_TEMP/r-prod-evidence/priority_characterization.log"
          echo G2_actual_block_execution_positive_control=PASS >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P4 strict execution versus txpool parity oracle
        if: env.R_PROD_MODE == 'priority'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          set +e
          go test -count=1 -timeout=8m -run '^TestRPriorityExecutionPoolStrictParity$' -v ./core 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/priority_strict.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            grep -Fq 'R_PRIORITY_POOL_EXECUTION_STRICT_PARITY_PASS' "$RUNNER_TEMP/r-prod-evidence/priority_strict.log"
            echo "G3_strict_oracle=PASS_no_mismatch" >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"
            echo "candidate=NONE" >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"
          else
            grep -Fq 'R_PRIORITY_POOL_EXECUTION_PARITY_MISMATCH:' "$RUNNER_TEMP/r-prod-evidence/priority_strict.log" || {
              echo "R_PRIORITY_STRICT_FAILED_WITHOUT_NAMED_ORACLE"
              exit "$rc"
            }
            {
              echo "G3_strict_oracle=SOURCE_MISMATCH_EXACT_MARKER"
              echo "candidate=PRIORITY_POOL_EXECUTION_PARITY"
              echo "production_reachability=OPEN"
              echo "security_finding=NO_NOT_UNTIL_G6_G7"
            } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"
          fi
          echo "G4_reproducer=reports/electroneum/R/production_depth/priority_consensus_integration_test.go" >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P4 actual chain reorg and pool state
        if: env.R_PROD_MODE == 'priority'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=8m -run '^TestRPriorityReorgPoolState$' -v ./core 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/priority_reorg.log"
          grep -Eq 'R_PRIORITY_REORG_POOL_STATE_PASS|R_PRIORITY_REORG_PRECONDITION_POOL_REJECT' "$RUNNER_TEMP/r-prod-evidence/priority_reorg.log"
          echo "G6_production_reachability=OPEN_no_live_validator_or_peer_network" >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: Verify source untouched and complete triage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code -- vendor/electroneum-sc
          {
            echo "certified_source_unchanged=PASS"
            echo "finding_gate=G1_G7_POLICY_ENFORCED"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"
          cat "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: Preserve evidence and deterministic reproducers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r-production-depth-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r-prod-evidence/
          if-no-files-found: warn
          retention-days: 14
