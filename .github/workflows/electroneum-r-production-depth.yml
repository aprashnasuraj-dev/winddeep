name: Electroneum Worker R - Production Depth Verification

on:
  push:
    branches:
      - 'audit/r-production-depth-20261104-*'
      - '!audit/r-production-depth-20261104-seed'
    paths:
      - 'reports/electroneum/R/production_depth/**'
      - '.github/workflows/electroneum-r-production-depth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-production-depth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pin exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select one production-depth campaign
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          selector="$(tr -d '\n' < reports/electroneum/R/production_depth/selection.txt)"
          test "$GITHUB_REF_NAME" = "audit/r-production-depth-20261104-$selector"
          case "$selector" in
            01-full-backend) mode=full ;;
            02-persist-restart) mode=persist ;;
            03-parser-budgets) mode=parser ;;
            04-priority-consensus) mode=priority ;;
            05-persist-abrupt-exit) mode=persist ;;
            06-peer-downloader-reorg) mode=peer ;;
            07-devp2p-loopback) mode=devp2p ;;
            08-qbft-quorum-gate) mode=qbft ;;
            09-qbft-devp2p-e2e) mode=qbftnet ;;
            10-waitmined-impact) mode=impact ;;
            11-guard-residual) mode=guardresidual ;;
            12-lower-authority-peer) mode=lowerauth ;;
            13-consumer-finality) mode=consumerfinality ;;
            14-leveldb-wal-fault) mode=walfault ;;
            15-leveldb-batch-write) mode=batchfault ;;
            16-fsize-qbft-reachability) mode=realos ;;
            17-enospc-peer-threshold) mode=enospc ;;
            18-disk-growth-oracle) mode=growth ;;
            19-multiheight-oracle) mode=multifork ;;
            20-untrusted-eth66-replay) mode=untrustedreplay ;;
            *) echo R_PROD_DEPTH_BAD_SELECTOR; exit 64 ;;
          esac
          echo "R_PROD_SELECTOR=$selector" >> "$GITHUB_ENV"
          echo "R_PROD_MODE=$mode" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/r-prod-evidence"
          printf 'selector=%s\nevent_sha=%s\n' "$selector" "$GITHUB_SHA" > "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: Certify immutable target
        shell: bash
        run: |
          set -euo pipefail
          source tools/electroneum_target_bootstrap.sh
          test "$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT" = 7eb84ee39bd01eaaf1f64afbd871b06c85ff3bb0
          test "$WINDEEP_ETN_SOURCE_TREE_SHA" = de7f3c75a2db7e87a89918f1257820703d5b731e
          {
            echo "certified_source=$WINDEEP_ETN_CERTIFIED_SOURCE_COMMIT"
            echo "certified_tree=$WINDEEP_ETN_SOURCE_TREE_SHA"
            echo "G1_source_identity=PASS"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: Set up Go 1.24.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.0'
          cache: false

      - name: Mount only Worker R tests in disposable source
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/r-prod-depth-$R_PROD_SELECTOR"
          mkdir -p "$scratch"
          cp -a "$WINDEEP_ETN_SOURCE"/. "$scratch"/
          case "$R_PROD_MODE" in
            full)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_prod_depth_test.go"
              ;;
            persist)
              chmod u+w "$scratch/core"
              cp reports/electroneum/R/production_depth/persistent_sync_restart_test.go "$scratch/core/worker_r_prod_depth_test.go"
              ;;
            parser)
              chmod u+w "$scratch/rpc" "$scratch/accounts/abi" "$scratch/core/types"
              cp reports/electroneum/R/production_depth/parser_rpc_limit_test.go "$scratch/rpc/worker_r_prod_depth_test.go"
              cp reports/electroneum/R/production_depth/parser_abi_limit_test.go "$scratch/accounts/abi/worker_r_prod_depth_test.go"
              cp reports/electroneum/R/production_depth/parser_tx_receipt_limit_test.go "$scratch/core/types/worker_r_prod_depth_test.go"
              ;;
            priority)
              chmod u+w "$scratch/core"
              cp reports/electroneum/R/production_depth/priority_consensus_integration_test.go "$scratch/core/worker_r_prod_depth_test.go"
              ;;
            peer)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_test.go"
              ;;
            devp2p)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_helper_test.go"
              cp reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go "$scratch/eth/worker_r_devp2p_loopback_test.go"
              ;;
            qbft)
              chmod u+w "$scratch/consensus/istanbul/backend"
              cp reports/electroneum/R/production_depth/qbft_quorum_gate_test.go "$scratch/consensus/istanbul/backend/worker_r_qbft_quorum_gate_test.go"
              ;;
            qbftnet)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_helper_test.go"
              cp reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go "$scratch/eth/worker_r_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_devp2p_reorg_test.go "$scratch/eth/worker_r_qbft_devp2p_test.go"
              ;;
            impact)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/waitmined_impact_test.go "$scratch/eth/worker_r_waitmined_impact_test.go"
              ;;
            guardresidual)
              chmod u+w "$scratch/eth" "$scratch/internal/ethapi" "$scratch/internal/ethapi/api.go"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/canonical_guard_residual_test.go "$scratch/eth/worker_r_guard_residual_test.go"
              python3 reports/electroneum/R/production_depth/canonical_guard_residual_patch.py "$scratch/internal/ethapi/api.go"
              ;;
            lowerauth)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_helper_test.go"
              cp reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go "$scratch/eth/worker_r_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_devp2p_reorg_test.go "$scratch/eth/worker_r_qbft_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/lower_authority_peer_test.go "$scratch/eth/worker_r_lower_authority_peer_test.go"
              ;;
            walfault)
              chmod u+w "$scratch/core"
              cp reports/electroneum/R/production_depth/persistent_sync_restart_test.go "$scratch/core/worker_r_persist_helper_test.go"
              cp reports/electroneum/R/production_depth/persistent_wal_fault_test.go "$scratch/core/worker_r_wal_fault_test.go"
              ;;
            batchfault)
              chmod u+w "$scratch/core"
              cp reports/electroneum/R/production_depth/persistent_sync_restart_test.go "$scratch/core/worker_r_persist_helper_test.go"
              cp reports/electroneum/R/production_depth/persistent_wal_fault_test.go "$scratch/core/worker_r_wal_helper_test.go"
              cp reports/electroneum/R/production_depth/persistent_batch_write_failure_test.go "$scratch/core/worker_r_batch_failure_test.go"
              chmod u+w "$scratch/internal/ethapi"
              cp reports/electroneum/R/production_depth/batch_receipt_public_rpc_test.go "$scratch/internal/ethapi/worker_r_batch_receipt_public_rpc_test.go"
              ;;
            realos)
              chmod u+w "$scratch/core"
              cp reports/electroneum/R/production_depth/persistent_sync_restart_test.go "$scratch/core/worker_r_persist_helper_test.go"
              cp reports/electroneum/R/production_depth/persistent_wal_fault_test.go "$scratch/core/worker_r_wal_helper_test.go"
              cp reports/electroneum/R/production_depth/persistent_batch_write_failure_test.go "$scratch/core/worker_r_batch_helper_test.go"
              cp reports/electroneum/R/production_depth/persistent_real_os_wal_limit_test.go "$scratch/core/worker_r_real_os_limit_test.go"
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_helper_test.go"
              cp reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go "$scratch/eth/worker_r_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_devp2p_reorg_test.go "$scratch/eth/worker_r_qbft_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/lower_authority_peer_test.go "$scratch/eth/worker_r_lower_authority_peer_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_storage_fault_reachability_test.go "$scratch/eth/worker_r_qbft_storage_fault_test.go"
              cp reports/electroneum/R/production_depth/qbft_eth66_real_disk_limit_test.go "$scratch/eth/worker_r_qbft_eth66_disk_limit_test.go"
              ;;
            enospc|growth|multifork|untrustedreplay)
              chmod u+w "$scratch/core"
              cp reports/electroneum/R/production_depth/persistent_sync_restart_test.go "$scratch/core/worker_r_persist_helper_test.go"
              cp reports/electroneum/R/production_depth/persistent_wal_fault_test.go "$scratch/core/worker_r_wal_helper_test.go"
              cp reports/electroneum/R/production_depth/persistent_batch_write_failure_test.go "$scratch/core/worker_r_batch_helper_test.go"
              cp reports/electroneum/R/production_depth/persistent_real_os_wal_limit_test.go "$scratch/core/worker_r_real_os_limit_helper_test.go"
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_helper_test.go"
              cp reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go "$scratch/eth/worker_r_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_devp2p_reorg_test.go "$scratch/eth/worker_r_qbft_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/lower_authority_peer_test.go "$scratch/eth/worker_r_lower_authority_peer_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_storage_fault_reachability_test.go "$scratch/eth/worker_r_qbft_storage_fault_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_eth66_real_disk_limit_test.go "$scratch/eth/worker_r_qbft_eth66_disk_limit_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_real_enospc_peer_threshold_test.go "$scratch/eth/worker_r_qbft_real_enospc_threshold_test.go"
              if [ "$R_PROD_MODE" = growth ]; then
                cp reports/electroneum/R/production_depth/qbft_peer_disk_growth_oracle_test.go "$scratch/eth/worker_r_qbft_disk_growth_test.go"
              fi
              if [ "$R_PROD_MODE" = multifork ]; then
                cp reports/electroneum/R/production_depth/qbft_peer_disk_growth_oracle_test.go "$scratch/eth/worker_r_qbft_disk_growth_helper_test.go"
                cp reports/electroneum/R/production_depth/qbft_multiheight_disk_replay_restart_test.go "$scratch/eth/worker_r_qbft_multiheight_disk_test.go"
              fi
              if [ "$R_PROD_MODE" = untrustedreplay ]; then
                cp reports/electroneum/R/production_depth/qbft_peer_disk_growth_oracle_test.go "$scratch/eth/worker_r_qbft_disk_growth_helper_test.go"
                cp reports/electroneum/R/production_depth/qbft_multiheight_disk_replay_restart_test.go "$scratch/eth/worker_r_qbft_multiheight_helper_test.go"
                cp reports/electroneum/R/production_depth/qbft_eth66_unprivileged_replay_longchain_test.go "$scratch/eth/worker_r_qbft_unprivileged_replay_test.go"
              fi
              ;;
            consumerfinality)
              chmod u+w "$scratch/eth"
              cp reports/electroneum/R/production_depth/full_backend_reorg_test.go "$scratch/eth/worker_r_full_backend_helper_test.go"
              cp reports/electroneum/R/production_depth/peer_downloader_reorg_test.go "$scratch/eth/worker_r_peer_downloader_helper_test.go"
              cp reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go "$scratch/eth/worker_r_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/qbft_devp2p_reorg_test.go "$scratch/eth/worker_r_qbft_devp2p_helper_test.go"
              cp reports/electroneum/R/production_depth/lower_authority_peer_test.go "$scratch/eth/worker_r_lower_authority_peer_helper_test.go"
              cp reports/electroneum/R/production_depth/consumer_finality_test.go "$scratch/eth/worker_r_consumer_finality_test.go"
              ;;
          esac
          echo "R_PROD_SCRATCH=$scratch" >> "$GITHUB_ENV"

      - name: P1 full BlockChain and EthAPIBackend reorg
        if: env.R_PROD_MODE == 'full'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestRFullBackend' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/full_backend.log"
          grep -Fq 'R_FULL_BACKEND_TOCTOU_ORACLE_MISMATCH' "$RUNNER_TEMP/r-prod-evidence/full_backend.log"
          grep -Fq 'R_FULL_BACKEND_PEER_EQUIVALENT_INSERTCHAIN_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/full_backend.log"
          {
            echo "G2_positive_control=PASS"
            echo "G3_named_oracle=PASS"
            echo "G4_reproducer=reports/electroneum/R/production_depth/full_backend_reorg_test.go"
            echo "G6_production_reachability=OPEN_peer_equivalent_InsertChain_not_devp2p"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1b downloader Peer and LegacySync reorg reachability
        if: env.R_PROD_MODE == 'peer'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestRPeerDownloaderReorgRace$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/peer_downloader.log"
          grep -Fq 'R_PEER_DOWNLOADER_REORG_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/peer_downloader.log"
          if grep -Fq 'R_PEER_DOWNLOADER_TOCTOU_OBSERVED' "$RUNNER_TEMP/r-prod-evidence/peer_downloader.log"; then
            echo "G6_peer_downloader_reachability=OBSERVED_IN_SYNTHETIC_PROTOCOL_PEER" >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"
          else
            echo "G6_peer_downloader_reachability=NOT_OBSERVED_IN_BOUNDED_CAMPAIGN" >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"
          fi
          {
            echo "G2_positive_control=PASS_real_downloader_LegacySync"
            echo "G4_reproducer=reports/electroneum/R/production_depth/peer_downloader_reorg_test.go"
            echo "external_public_network=NOT_USED"
            echo "QBFT_validator_adversary=NOT_TESTED"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1c real loopback TCP RLPx devp2p reorg reachability
        if: env.R_PROD_MODE == 'devp2p'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=15m -run '^TestRDevP2PLoopbackReorgReachability$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/devp2p_loopback.log"
          grep -Fq 'R_DEVP2P_TCP_RLPX_PEER_CONNECTED' "$RUNNER_TEMP/r-prod-evidence/devp2p_loopback.log"
          grep -Fq 'R_DEVP2P_DOWNLOADER_REORG_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/devp2p_loopback.log"
          {
            echo "G2_positive_control=PASS_real_TCP_RLPx_ETH66_peer"
            echo "G4_reproducer=reports/electroneum/R/production_depth/devp2p_loopback_reorg_test.go"
            echo "G6_transport_reachability=PARTIAL_REAL_LOOPBACK_TCP_RLPx_DEVP2P_TO_DOWNLOADER"
            echo "external_public_network=NOT_USED"
            echo "QBFT_valid_competing_fork_adversary=NOT_ESTABLISHED"
            echo "G7_concrete_downstream_impact=OPEN"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1d QBFT validator-quorum import gate
        if: env.R_PROD_MODE == 'qbft'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=12m -run '^TestRQBFTQuorumGate$' -v ./consensus/istanbul/backend 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/qbft_quorum.log"
          grep -Fq 'R_QBFT_QUORUM_MATRIX_PASS' "$RUNNER_TEMP/r-prod-evidence/qbft_quorum.log"
          grep -Fq 'R_QBFT_SUBQUORUM_REJECTED validators=4 seals=2 required=3' "$RUNNER_TEMP/r-prod-evidence/qbft_quorum.log"
          grep -Fq 'R_QBFT_SUBQUORUM_REJECTED validators=7 seals=4 required=5' "$RUNNER_TEMP/r-prod-evidence/qbft_quorum.log"
          grep -Fq 'R_QBFT_OUTSIDER_REJECTED' "$RUNNER_TEMP/r-prod-evidence/qbft_quorum.log"
          {
            echo "G2_positive_control=PASS_exact_QBFT_quorum_import"
            echo "G5_counterexample=PASS_subquorum_duplicate_outsider_rejected"
            echo "G6_consensus_precondition=QBFT_VALID_COMPETING_FORK_REQUIRES_CEIL_2N_OVER_3_UNIQUE_VALIDATOR_SEALS"
            echo "ordinary_external_peer_without_validator_keys=REJECTED_BY_CONSENSUS_GATE"
            echo "validator_quorum_adversary_or_legitimate_competing_finality=NOT_ESTABLISHED"
            echo "G7_concrete_downstream_impact=OPEN"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1e quorum-authorized QBFT branch over real devp2p
        if: env.R_PROD_MODE == 'qbftnet'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=15m -run '^TestRQBFTDevP2PQuorumReorgRace$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/qbft_devp2p.log"
          grep -Fq 'R_QBFT_DEVP2P_QUORUM_BRANCH_BUILT validators=4 quorum=3' "$RUNNER_TEMP/r-prod-evidence/qbft_devp2p.log"
          grep -Fq 'R_QBFT_DEVP2P_TCP_RLPX_CONNECTED' "$RUNNER_TEMP/r-prod-evidence/qbft_devp2p.log"
          grep -Fq 'R_QBFT_DEVP2P_QUORUM_REORG_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/qbft_devp2p.log"
          {
            echo "G2_positive_control=PASS_quorum_authorized_QBFT_branch"
            echo "G6_conditional_reachability=QUORUM_AUTHORIZED_BRANCH_OVER_REAL_TCP_RLPx_DEVP2P"
            echo "actor_requirement=CEIL_2N_OVER_3_VALIDATOR_KEYS_IN_FIXTURE"
            echo "ordinary_external_peer=NOT_THIS_ACTOR_MODEL"
            echo "G7_concrete_downstream_impact=OPEN"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1f shipped bind WaitMined client-integrity impact
        if: env.R_PROD_MODE == 'impact'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          cd "$R_PROD_SCRATCH"
          go test -count=1 -timeout=10m -run '^TestRWaitMinedStaleReceiptImpact$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/waitmined_impact.log"
          grep -Fq 'R_WAITMINED_STALE_MINED_SIGNAL' "$RUNNER_TEMP/r-prod-evidence/waitmined_impact.log"
          grep -Fq 'R_WAITMINED_CANONICAL_RECHECK_REJECTS_PASS' "$RUNNER_TEMP/r-prod-evidence/waitmined_impact.log"
          grep -Fq 'R_WAITMINED_POST_REORG_NOTFOUND_CONTROL_PASS' "$RUNNER_TEMP/r-prod-evidence/waitmined_impact.log"
          grep -Fq 'R_WAITMINED_G7_CLIENT_INTEGRITY_IMPACT_PASS' "$RUNNER_TEMP/r-prod-evidence/waitmined_impact.log"
          {
            echo "G7_client_integrity=SHIPPED_BIND_WAITMINED_RETURNS_NONCANONICAL_RECEIPT"
            echo "G7_counterexample=SHIPPED_ETHCLIENT_CANONICAL_HEADER_RECHECK_REJECTS"
            echo "financial_loss=NOT_CLAIMED"
            echo "ordinary_external_peer_actor=NOT_ESTABLISHED"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P1g candidate canonical guard residual TOCTOU
        if: env.R_PROD_MODE == 'guardresidual'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
