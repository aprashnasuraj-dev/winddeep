            echo "G4_reproducer=reports/electroneum/R/production_depth/qbft_peer_disk_growth_oracle_test.go"
            echo "G5_counterexample=PASS_small_vs_large_valid_blocks_and_direct_canonical_import"
            echo "G6_attacker_driven_disk_exhaustion=NOT_ESTABLISHED_repeat_body_traffic_must_be_measured_separately"
            echo "G7_impact=NONE_CLAIMED_from_disk_growth_measurement"
            echo "classification=BASELINE_ONLY_review_log_ratios_before_security_promotion"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P2j multi-height ETH66 fork replay compaction restart
        if: env.R_PROD_MODE == 'multifork'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/r-p2j-multifork.ext4"
          mountpoint="$RUNNER_TEMP/r-p2j-multifork-mnt"
          truncate -s 128M "$image"
          mkfs.ext4 -q -F -m 0 "$image"
          mkdir -p "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          sudo chown "$(id -u):$(id -g)" "$mountpoint"
          cleanup() {
            sync || true
            sudo umount "$mountpoint" || true
          }
          trap cleanup EXIT
          test "$(findmnt -n -o FSTYPE --target "$mountpoint")" = ext4
          df -B1 "$mountpoint" > "$RUNNER_TEMP/r-prod-evidence/p2j_df_initial.txt"
          cd "$R_PROD_SCRATCH"
          R_P2J_DISK_ROOT="$mountpoint" go test -count=1 -timeout=16m -run '^TestRQBFTMultiHeightDiskGrowthAndRestart$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/p2j_multifork.log"
          grep -Fq 'R_P2J_MULTIHEIGHT_A_BASELINE' "$RUNNER_TEMP/r-prod-evidence/p2j_multifork.log"
          grep -Fq 'R_P2J_DUPLICATE_REPLAY_OBSERVATION' "$RUNNER_TEMP/r-prod-evidence/p2j_multifork.log"
          grep -Fq 'R_P2J_ABANDONED_FORK_BASELINE' "$RUNNER_TEMP/r-prod-evidence/p2j_multifork.log"
          grep -Fq 'R_P2J_OLD_FORK_REPLAY_CONTROL' "$RUNNER_TEMP/r-prod-evidence/p2j_multifork.log"
          grep -Fq 'R_P2J_COMPACTION_MATRIX' "$RUNNER_TEMP/r-prod-evidence/p2j_multifork.log"
          grep -Fq 'R_P2J_RESTART_PERSISTENCE_PASS' "$RUNNER_TEMP/r-prod-evidence/p2j_multifork.log"
          grep -Fq 'R_P2J_P2J_VALIDATED' "$RUNNER_TEMP/r-prod-evidence/p2j_multifork.log"
          {
            echo "G1_certified_source=PASS"
            echo "G2_real_ETH66_multiheight=PASS_quorum_signed_3_and_4_block_chains"
            echo "G3_storage_oracle=MEASURE_physical_allocation_vs_identical_direct_import_for_canonical_and_abandoned_forks"
            echo "G4_reproducer=reports/electroneum/R/production_depth/qbft_multiheight_disk_replay_restart_test.go"
            echo "G5_replay_and_compaction_controls=CAPTURED_see_p2j_multifork.log"
            echo "G6_unprivileged_peer_fork_authority=NOT_ESTABLISHED_prior_subquorum_rejected"
            echo "G7_security_impact=NOT_AUTOMATIC_from_storage_growth"
            echo "classification=MEASUREMENT_ONLY_not_remotely_exploitable_until_positive_actor_path_proved"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: P2k untrusted ETH66 replay and long-chain persistence
        if: env.R_PROD_MODE == 'untrustedreplay'
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 768MiB
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/r-p2k-untrustedreplay.ext4"
          mountpoint="$RUNNER_TEMP/r-p2k-untrustedreplay-mnt"
          truncate -s 256M "$image"
          mkfs.ext4 -q -F -m 0 "$image"
          mkdir -p "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          sudo chown "$(id -u):$(id -g)" "$mountpoint"
          cleanup() {
            sync || true
            sudo umount "$mountpoint" || true
          }
          trap cleanup EXIT
          test "$(findmnt -n -o FSTYPE --target "$mountpoint")" = ext4
          df -B1 "$mountpoint" > "$RUNNER_TEMP/r-prod-evidence/p2k_df_initial.txt"
          cd "$R_PROD_SCRATCH"
          R_P2K_DISK_ROOT="$mountpoint" go test -count=1 -timeout=17m -run '^TestRQBFTUnprivilegedETH66ReplayAndLongChainDisk$' -v ./eth 2>&1 | tee "$RUNNER_TEMP/r-prod-evidence/p2k_untrusted_replay.log"
          grep -Fq 'R_P2K_VALID_QUORUM_FIXTURE_PASS' "$RUNNER_TEMP/r-prod-evidence/p2k_untrusted_replay.log"
          grep -Fq 'R_P2K_LONGCHAIN_BASELINE' "$RUNNER_TEMP/r-prod-evidence/p2k_untrusted_replay.log"
          grep -Fq 'R_P2K_STALE_ID_REPLAY_RESULT' "$RUNNER_TEMP/r-prod-evidence/p2k_untrusted_replay.log"
          grep -Fq 'R_P2K_UNKNOWN_ID_REPLAY_RESULT' "$RUNNER_TEMP/r-prod-evidence/p2k_untrusted_replay.log"
          grep -Fq 'R_P2K_COMPACTION_CONTROL' "$RUNNER_TEMP/r-prod-evidence/p2k_untrusted_replay.log"
          grep -Fq 'R_P2K_RESTART_DISK_ORACLE_PASS' "$RUNNER_TEMP/r-prod-evidence/p2k_untrusted_replay.log"
          grep -Fq 'R_P2K_P2K_VALIDATED' "$RUNNER_TEMP/r-prod-evidence/p2k_untrusted_replay.log"
          {
            echo "G1_certified_source=PASS"
            echo "G2_real_ETH66_8block_chain=PASS"
            echo "G3_attacker_authority=ONLY_p2p_transport_request_IDs_NOT_validator_sealing"
            echo "G4_test=reports/electroneum/R/production_depth/qbft_eth66_unprivileged_replay_longchain_test.go"
            echo "G5_replay=SEPARATE_stale_and_unsolicited_request_ids_and_reconnect"
            echo "G6_storage_oracle=COMPARE_canonical_direct_import_and_restart_after_compaction"
            echo "G7_impact=NO_EXHAUSTION_CLAIM_without_peer_only_storage_amplification"
            echo "classification=REPLAY_REJECTION_CONTROL_NO_BOUNTY_CLAIM_WITHOUT_POSITIVE_EVIDENCE"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: Verify source untouched and complete triage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code -- vendor/electroneum-sc
          {
            echo "certified_source_unchanged=PASS"
            echo "finding_gate=G1_G7_POLICY_ENFORCED"
          } >> "$RUNNER_TEMP/r-prod-evidence/triage.txt"
          cat "$RUNNER_TEMP/r-prod-evidence/triage.txt"

      - name: Preserve evidence and deterministic reproducers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r-production-depth-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r-prod-evidence/
          if-no-files-found: warn
          retention-days: 14
