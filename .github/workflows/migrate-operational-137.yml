name: Operational 137 Integration Migration

on:
  push:
    branches: [release/operational-137-v0.1.1]

permissions:
  contents: write

jobs:
  migrate-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply deterministic migration
        run: python scripts/migrate_operational_137.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Static release audit
        run: python scripts/audit/release_audit.py --phase A

      - name: Packaging contract audit
        run: python scripts/audit/release_audit.py --phase B

      - name: Unit and integration tests
        run: python -m pytest -q --cov=app --cov=launcher --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=85

      - name: Commit verified migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools_config.json app/engine/tool_wrapper.py app/server.py scripts/audit/release_audit.py tests/test_release_catalog_contract.py tests/test_release_surface.py tests/test_server_release.py reports/static_audit.md reports/tool_liveness.md
          git commit -m "feat: expose all 137 catalog integrations at runtime"
          git push origin HEAD:release/operational-137-v0.1.1
